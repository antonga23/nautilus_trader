exclude: ^examples/live/cloudbet\.py$
default_language_version:
  python: python3.12

repos:
  ##############################################################################
  #  General checks
  ##############################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-new-submodules
      - id: end-of-file-fixer
        types_or: [rust, cython, python, markdown]
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
        exclude: ^crates/serialization/generated/capnp/
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        description: Formats shell scripts with the runner-installed shfmt binary
        entry: shfmt
        language: system
        args: ["-i", "2", "-ci", "-sr", "-ln", "bash", "-w"]
        types: [shell]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]
        exclude: ^qodana\.yaml$|^\.gitlab-ci\.yml$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        name: dockerfile-lint
        description: Lint Dockerfiles for best practices and errors

  - repo: https://github.com/crate-ci/typos
    rev: v1.40.0 # Pinned to 1.40.0 for security (autoupdate bumps to moving v1 tag)
    hooks:
      - id: typos
        description: Checks for common typos
        args: ["--force-exclude"]
        types_or: [rust, python, cython, toml, yaml, rst, markdown]
        exclude: &legacy_cloudbet_exclude >-
          (?x)^(
            nautilus_trader/adapters/cloudbet/
            |examples/live/cloudbet\.py$
            |tests/.*cloudbet.*
            |nautilus_trader/common/(clock|logging)\.py$
            |nautilus_trader/execution/reports\.py$
            |nautilus_trader/model/(currencies|currency|orderbook)\.py$
            |nautilus_trader/model/instruments/crypto_betting\.py$
            |nautilus_trader/msgbus/
            |nautilus_trader/network/
            |nautilus_trader/serialization/arrow/serializer\.py$
            |nautilus_trader/test_kit/providers\.py$
            |nautilus_trader/test_kit/stubs/component\.py$
            |tests/integration_tests/adapters/conftest\.py$
            |tests/unit_tests/model/test_model_instrument\.py$
          )

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        description: Checks for common misspellings
        args: ["--ignore-words-list", "acn,alo,arange,highter,nd,ot,pnl,secur,serie,strat"]
        types_or: [rust, python, cython, toml, yaml, rst, markdown]
        exclude: *legacy_cloudbet_exclude

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        description: Detects hard-coded secrets prior to commit
        args: ["--staged", "--redact"]

  - repo: https://github.com/google/osv-scanner
    rev: v2.3.1
    hooks:
      - id: osv-scanner
        name: osv-scanner (dependency vulnerabilities)
        description: Scans Cargo.lock and uv.lock for known vulnerabilities (warn-only)
        args: ["--config=osv-scanner.toml", "--lockfile=Cargo.lock", "--lockfile=uv.lock"]
        verbose: true
        entry: bash scripts/ci/run_osv_scanner_warn_only.sh
        pass_filenames: false

  ##############################################################################
  #  GitHub Actions linting (complementary tools covering different aspects)
  ##############################################################################
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        name: actionlint (syntax/structure)
        description: Checks GitHub Actions workflow syntax and structural correctness

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.19.0
    hooks:
      - id: zizmor
        name: zizmor (security)
        description: Scans GitHub Actions workflows for security misconfigurations
        args: ["--no-online-audits", "--min-severity", "medium", ".github/"]
        pass_filenames: false

  ##############################################################################
  #  Custom hooks
  ##############################################################################
  - repo: local
    hooks:
      - id: check-hidden-chars
        name: check hidden unicode/control chars
        description: Fail on hidden control or zero-width unicode characters in source
        entry: .pre-commit-hooks/check_hidden_chars.sh
        language: script
        types_or: [rust, python, cython, toml, markdown, yaml, json, text]
        files: '\.(rs|py|pyx|toml|md|yml|yaml|json|sh|dockerfile)$|Dockerfile.*'

      - id: check-non-latin-text
        name: check non-Latin text
        description: Detect non-Latin characters (CJK, Cyrillic, Arabic, etc.) to enforce English-only
        entry: .pre-commit-hooks/check_non_latin_text.sh
        language: script
        types: [text]
        files: '\.(rs|py|pyx|md|toml|yaml|yml)$'

      - id: check-toml-codegen
        name: check toml-codegen
        description: Ensures TOML files don't contain the 'codegen-backend' keyword
        entry: .pre-commit-hooks/check_toml_codegen.sh
        language: script
        files: \.toml$

      - id: check-todo-exclamation
        name: check todo! markers
        description: Prevents committing TODO! markers that indicate incomplete work
        entry: .pre-commit-hooks/check_todo_exclamation.sh
        language: script
        types: [text]
        pass_filenames: false

      - id: check-copyright-year
        name: check copyright year
        description: Ensures copyright headers have current year
        entry: .pre-commit-hooks/check_copyright_year.sh
        language: script
        types_or: [rust, python]
        pass_filenames: false

      - id: check-error-conventions
        name: check error conventions
        description: Enforces error variable naming conventions
        entry: .pre-commit-hooks/check_error_conventions.sh
        language: script
        types_or: [rust, python, cython]
        pass_filenames: false

      - id: check-betting-brittleness
        name: check betting brittleness seams
        description: Prevents legacy betting matcher/risk seams from returning
        entry: python3 scripts/betting/scan_betting_brittleness.py
        language: system
        pass_filenames: false

  ##############################################################################
  #  Rust formatting and linting
  ##############################################################################
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.18.9
    hooks:
      - id: cargo-deny
        name: cargo deny (dependency vulnerabilities)
        args: ["--all-features", "check"]
        stages: [manual]

  - repo: local
    hooks:
      - id: cargo-vet
        name: cargo vet (supply chain audit)
        description: Run cargo-vet supply chain audit if installed
        entry: .pre-commit-hooks/cargo_vet.sh
        language: script
        files: '^Cargo\.(toml|lock)$|^supply-chain/'
        pass_filenames: false
        stages: [manual]

  - repo: local
    hooks:
      - id: check-anyhow-usage
        name: check anyhow usage
        description: Enforces anyhow conventions
        entry: .pre-commit-hooks/check_anyhow_usage.sh
        language: script
        files: '\.rs$'
        pass_filenames: false
        stages: [manual]

      - id: check-logging-macro-usage
        name: check logging macro usage
        description: Enforces logging macro conventions
        entry: .pre-commit-hooks/check_logging_macro_usage.sh
        language: script
        files: '\.rs$'
        pass_filenames: false
        stages: [manual]

      - id: check-tokio-usage
        name: check tokio usage
        description: Enforces tokio usage conventions
        entry: .pre-commit-hooks/check_tokio_usage.sh
        language: script
        files: '\.rs$|Cargo\.toml$'
        pass_filenames: false
        stages: [manual]

      - id: check-pyo3-conventions
        name: check pyo3 conventions
        description: Enforces PyO3 naming conventions
        entry: .pre-commit-hooks/check_pyo3_conventions.sh
        language: script
        files: '\.rs$'
        pass_filenames: false
        stages: [manual]

      - id: check-testing-conventions
        name: check testing conventions
        description: Enforces testing standardizations and conventions
        entry: .pre-commit-hooks/check_testing_conventions.sh
        language: script
        types_or: [rust]
        pass_filenames: false
        stages: [manual]

      - id: check-nautilus-conventions
        name: check nautilus conventions
        description: Enforces Nautilus type usage conventions
        entry: .pre-commit-hooks/check_nautilus_conventions.sh
        language: script
        files: '\.rs$'
        pass_filenames: false
        stages: [manual]

      - id: fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: bash .pre-commit-hooks/cargo_fmt_stable.sh
        language: system
        args: ["--all", "--", "--check"]
        files: '\.(rs|toml)$'
        types: [file]
        pass_filenames: false
        stages: [manual]

      - id: cargo-clippy
        name: cargo clippy
        description: Run the Clippy linter on the workspace
        entry: cargo clippy
        language: system
        args:
          [
            "--workspace",
            "--all-targets",
            "--features",
            "ffi,python,high-precision,defi",
            "--profile",
            "nextest", # Reduce rebuild triggers between testing and linting
            "--",
            "-D",
            "warnings",
          ]
        files: '\.(rs|toml)$'
        types: [file]
        pass_filenames: false
        stages: [manual]

      # TODO: Disabling for now as too slow
      # - id: cargo-doc
      #   name: cargo doc
      #   description: Check documentation builds without errors or warnings
      #   entry:
      #     cargo doc --workspace --features "ffi,python,high-precision,defi"
      #     --profile nextest --no-deps --quiet
      #   language: system
      #   files: '\.(rs|toml)$'
      #   types: [file]
      #   pass_filenames: false

  ##############################################################################
  #  Python/Cython formatting and linting
  ##############################################################################
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]
        exclude: *legacy_cloudbet_exclude

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
        name: add-trailing-comma
        types: [python]
        exclude: *legacy_cloudbet_exclude

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: ruff
        args: ["--fix"]
        exclude: *legacy_cloudbet_exclude
      - id: ruff-format
        name: ruff-format
        exclude: *legacy_cloudbet_exclude

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (cython)
        types: [cython]
        entry: "isort"
        args: ["--settings-file", "pyproject.toml"]

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        language_version: python3.13 # Pin to 3.13 due to incompatibility with 3.14
        additional_dependencies: [tomli]
        exclude: *legacy_cloudbet_exclude
        args: [
          "--wrap-summaries", "88",
          "--wrap-descriptions", "88",
          "--make-summary-multi-line",
          "--pre-summary-newline",
          "--blank",
          "--recursive",
          "--in-place",
        ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        language_version: python3.13 # Pin to 3.13 due to incompatibility with 3.14
        exclude: >-
          (?x)^(
            python/
            |websocket-server/
            |nautilus_trader/examples/strategies/betting_market_maker\.py$
            |nautilus_trader/.*\.pyi$
            |nautilus_trader/adapters/tenbet/
            |nautilus_trader/adapters/cloudbet/
            |nautilus_trader/live/strategy_nodes/betting_arbitrage/
            |scripts/betting/exp4_probe-assembly-cost\.py$
            |scripts/betting/exp4_semantic-pattern-coverage\.py$
            |tests/.*cloudbet.*
            |tests/unit/adapters/test_tenbet_adapter\.py$
            |tests/unit/live/test_betting_arbitrage_nodes\.py$
            |nautilus_trader/common/(clock|logging)\.py$
            |nautilus_trader/execution/reports\.py$
            |nautilus_trader/model/(currencies|currency|orderbook)\.py$
            |nautilus_trader/model/instruments/crypto_betting\.py$
            |nautilus_trader/msgbus/
            |nautilus_trader/network/
            |nautilus_trader/serialization/arrow/serializer\.py$
            |nautilus_trader/test_kit/providers\.py$
            |nautilus_trader/test_kit/stubs/component\.py$
            |tests/integration_tests/adapters/conftest\.py$
            |tests/unit_tests/model/test_model_instrument\.py$
          )
        args: [
          "--config", "pyproject.toml",
          "--allow-incomplete-defs",
        ]
        additional_dependencies: [
          msgspec,
          types-frozendict,
          types-pytz,
          types-redis,
          types-requests,
          types-toml,
        ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.21 # Must match uv-version file
    hooks:
      - id: uv-lock
        files: ^python/uv\.lock$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.2
    hooks:
      - id: nbstripout

  ##############################################################################
  #  Markdown formatting and linting
  ##############################################################################
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        entry: markdownlint-cli2
        args:
          - --config
          - .markdownlint.jsonc
          - --fix
        files: "\\.md$"
        exclude: '^(CLA\.md|CONTRIBUTING\.md|RELEASES\.md)$'
