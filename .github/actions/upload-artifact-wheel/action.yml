name: Upload wheel to transient CI storage
description: Upload wheel to transient CI storage

runs:
  using: "composite"
  steps:
    - name: Set release output
      shell: bash
      if:
        github.ref_name == 'develop' || github.ref_name == 'nightly' || github.ref_name ==
        'master' || github.ref_name == 'production' || github.ref_name == 'test-ci'
      id: vars
      run: |
        if [ ! -d "./dist" ]; then
          echo "Error: dist directory not found"
          exit 1
        fi

        ASSET_PATH=$(find ./dist -name "nautilus_trader-*.whl" -type f | xargs ls -t 2>/dev/null | head -n 1)

        if [ -z "$ASSET_PATH" ]; then
          echo "Error: No nautilus_trader wheel files found in dist directory"
          exit 1
        fi

        echo "ASSET_NAME=$(basename "$ASSET_PATH")" >> $GITHUB_ENV

    - name: Upload wheel to transient CI storage
      if:
        github.ref_name == 'develop' || github.ref_name == 'nightly' || github.ref_name ==
        'master' || github.ref_name == 'production' || github.ref_name == 'test-ci'
      shell: bash
      run: |
        bash scripts/ci/ci_transient_artifacts.sh \
          put "dist/${ASSET_NAME}" "wheels/${ASSET_NAME}"
