name: common-setup
description: Common environment setup

inputs:
  python-version:
    description: The Python version to setup
    required: true
  free-disk-space:
    description: Free disk space
    required: false
    default: "false"
  build-type:
    description: Type of build (pre-commit, test, release)
    required: false
    default: "release"
  skip-rust:
    description: Skip Rust toolchain setup
    required: false
    default: "false"
  skip-uv:
    description: Skip UV installation and cache setup
    required: false
    default: "false"
  skip-capnp:
    description: Skip Cap'n Proto installation
    required: false
    default: "false"
  skip-install-deps:
    description: Skip Linux runner dependency bootstrapping
    required: false
    default: "false"
  skip-setup-python:
    description: Skip actions/setup-python and use the runner Python
    required: false
    default: "false"
  force-rustup-update:
    description: Force a rustup self-update before selecting the pinned toolchain
    required: false
    default: "false"
  use-github-actions-cache:
    description: Use GitHub-hosted actions/cache for shared setup caches
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # > --------------------------------------------------
    # > OS
    - name: Free disk space (Ubuntu)
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      # https://github.com/jlumbroso/free-disk-space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: ${{ inputs.build-type != 'pre-commit' }}
        android: true
        dotnet: true
        haskell: ${{ inputs.build-type != 'pre-commit' }}
        large-packages: ${{ inputs.build-type != 'pre-commit' }}
        docker-images: true
        swap-storage: ${{ inputs.build-type != 'pre-commit' }}

    - name: Free disk space (Windows)
      if: inputs.free-disk-space == 'true' && runner.os == 'Windows'
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        rm -rf "/c/Program Files/dotnet"
        if [ "$BUILD_TYPE" != "pre-commit" ]; then
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019"
        fi

    - name: Install runner dependencies
      if: runner.os == 'Linux' && inputs.skip-install-deps != 'true'
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        packages=(build-essential curl git make pkg-config)

        if [[ "$BUILD_TYPE" == "pre-commit" ]]; then
          packages+=(ripgrep zlib1g-dev)
        else
          packages+=(clang cmake libssl-dev ripgrep python3-dev libpython3-dev zlib1g-dev)
        fi

        missing_packages=()

        for package in "${packages[@]}"; do
          if ! dpkg -s "$package" >/dev/null 2>&1; then
            missing_packages+=("$package")
          fi
        done

        if [ "${#missing_packages[@]}" -eq 0 ]; then
          echo "Runner dependencies already available"
          exit 0
        fi

        sudo apt-get update -o Acquire::Retries=5
        sudo apt-get install -y "${missing_packages[@]}" -o Acquire::Retries=5
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Install capnp and ripgrep (macOS)
      if: runner.os == 'macOS' && inputs.skip-capnp != 'true'
      shell: bash
      run: |
        brew update || { sleep 5; brew update; }
        brew install capnp ripgrep || { sleep 5; brew install capnp ripgrep; }
        brew cleanup

    - name: Set Cap'n Proto install prefix (Linux)
      if: runner.os == 'Linux' && inputs.skip-capnp != 'true'
      shell: bash
      run: |
        echo "CAPNP_PREFIX=$GITHUB_WORKSPACE/.cache/capnp" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/.cache/capnp/bin" >> $GITHUB_PATH

    - name: Get Linux version
      if: runner.os == 'Linux' && inputs.skip-capnp != 'true'
      id: linux-version
      shell: bash
      run: echo "release=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"

    - name: Get capnp version from capnp-version
      if: inputs.skip-capnp != 'true'
      shell: bash
      run: |
        echo "CAPNP_VERSION=$(cat capnp-version)" >> $GITHUB_ENV

    - name: Cache Cap'n Proto (Linux)
      if: runner.os == 'Linux' && inputs.skip-capnp != 'true' && inputs.use-github-actions-cache == 'true'
      id: cache-capnp
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.workspace }}/.cache/capnp
        key: capnp-linux-${{ steps.linux-version.outputs.release }}-${{ env.CAPNP_VERSION }}-${{ runner.arch }}

    - name: Install capnp
      if: runner.os == 'Linux' && inputs.skip-capnp != 'true'
      shell: bash
      run: bash scripts/install-capnp.sh

    - name: Install capnp (Windows)
      if: runner.os == 'Windows' && inputs.skip-capnp != 'true'
      shell: bash
      run: |
        choco install capnproto ripgrep -y || {
          echo "capnproto/ripgrep install via choco failed or unavailable"
          sleep 5
          choco install capnproto ripgrep -y || true
        }

    # > --------------------------------------------------
    # > Rust
    - name: Reset and update Rust toolchain
      if: inputs.skip-rust != 'true' && inputs.force-rustup-update == 'true'
      shell: bash
      run: bash scripts/ci/install-rust.sh

    - name: Get Rust toolchain version
      if: inputs.skip-rust != 'true'
      id: rust-toolchain
      shell: bash
      run: |
        echo "TOOLCHAIN=$(bash scripts/rust-toolchain.sh)" >> $GITHUB_ENV

    # https://github.com/actions-rust-lang/setup-rust-toolchain
    - name: Set up Rust toolchain
      if: inputs.skip-rust != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
      with:
        toolchain: ${{ env.TOOLCHAIN }}
        components: clippy,rustfmt
        override: true

    - name: Install cargo-nextest
      if: inputs.build-type == 'test' || inputs.build-type == 'release'
      # https://github.com/taiki-e/install-action # v2.53.2
      uses: taiki-e/install-action@d12e869b89167df346dd0ff65da342d1fb1202fb
      with:
        tool: nextest

    # > --------------------------------------------------
    # > sccache
    - name: Set sccache env vars (common)
      if: inputs.build-type == 'test' || inputs.build-type == 'release'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

        # Respect pre-existing settings from the workflow env; otherwise set sane defaults
        if [ -z "${SCCACHE_CACHE_SIZE:-}" ]; then echo "SCCACHE_CACHE_SIZE=4G" >> $GITHUB_ENV; fi
        if [ -z "${SCCACHE_IDLE_TIMEOUT:-}" ]; then echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV; fi
        if [ -z "${SCCACHE_DIRECT:-}" ]; then echo "SCCACHE_DIRECT=true" >> $GITHUB_ENV; fi
        if [ -z "${SCCACHE_CACHE_MULTIARCH:-}" ]; then echo "SCCACHE_CACHE_MULTIARCH=1" >> $GITHUB_ENV; fi

        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV

    - name: Set sccache env vars (non-Windows)
      if: runner.os != 'Windows' && (inputs.build-type == 'test' || inputs.build-type == 'release')
      shell: bash
      run: |
        echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.cache/sccache" >> $GITHUB_ENV
        echo "CC=sccache clang" >> $GITHUB_ENV
        echo "CXX=sccache clang++" >> $GITHUB_ENV

    - name: Set sccache env vars (Windows)
      if: runner.os == 'Windows' && (inputs.build-type == 'test' || inputs.build-type == 'release')
      shell: bash
      run: |
        echo SCCACHE_DIR="C:\.cache\sccache" >> $GITHUB_ENV
        echo CMAKE_C_COMPILER_LAUNCHER=sccache >> $GITHUB_ENV
        echo CMAKE_CXX_COMPILER_LAUNCHER=sccache >> $GITHUB_ENV

    - name: Run sccache
      if: inputs.build-type == 'test' || inputs.build-type == 'release'
      # https://github.com/Mozilla-Actions/sccache-action
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      continue-on-error: true # Build continues without cache if sccache setup fails

    # > --------------------------------------------------
    # > Python
    - name: Set up Python environment
      if: inputs.skip-setup-python != 'true'
      # https://github.com/actions/setup-python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Ensure ~/.local/bin on PATH
      shell: bash
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Get Python version
      shell: bash
      run: |
        echo "PYTHON_VERSION=$(bash scripts/python-version.sh)" >> $GITHUB_ENV

    - name: Get pre-commit version
      if: inputs.build-type == 'pre-commit' || inputs.build-type == 'rust-policy'
      shell: bash
      run: |
        echo "PRE_COMMIT_VERSION=$(bash scripts/pre-commit-version.sh)" >> $GITHUB_ENV

    - name: Cache pre-commit tool environment
      if: >-
        (inputs.build-type == 'pre-commit' || inputs.build-type == 'rust-policy') &&
        inputs.use-github-actions-cache == 'true'
      id: cached-pre-commit-tool
      # https://github.com/actions/cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pre-commit-tool
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version
          }}-pre-commit-tool-${{ env.PRE_COMMIT_VERSION }}

    - name: Install pre-commit
      if: inputs.build-type == 'pre-commit' || inputs.build-type == 'rust-policy'
      shell: bash
      env:
        PRE_COMMIT_VERSION: ${{ env.PRE_COMMIT_VERSION }}
        PRE_COMMIT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        pre_commit_tool_root="${HOME}/.cache/pre-commit-tool"
        pre_commit_tool_dir="${pre_commit_tool_root}/py${PRE_COMMIT_PYTHON_VERSION}-${PRE_COMMIT_VERSION}"
        pre_commit_venv="${pre_commit_tool_dir}/venv"
        pre_commit_python="${pre_commit_venv}/bin/python"
        pre_commit_bin="${pre_commit_venv}/bin/pre-commit"

        mkdir -p "${pre_commit_tool_root}"

        if [[ ! -x "${pre_commit_bin}" || ! -x "${pre_commit_python}" ]]; then
          rm -rf "${pre_commit_tool_dir}"
          python3 -m venv --copies "${pre_commit_venv}"
          "${pre_commit_python}" -m pip install --upgrade pip
          "${pre_commit_python}" -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
        fi

        installed_version="$("${pre_commit_python}" -m pre_commit --version | awk '{print $2}')"
        if [[ "${installed_version}" != "${PRE_COMMIT_VERSION}" ]]; then
          echo "Expected pre-commit ${PRE_COMMIT_VERSION}, got ${installed_version}" >&2
          exit 1
        fi

        echo "${pre_commit_venv}/bin" >> "${GITHUB_PATH}"

    # > --------------------------------------------------
    # > UV
    - name: Get uv version from uv-version
      if: inputs.skip-uv != 'true'
      shell: bash
      run: |
        echo "UV_VERSION=$(cat uv-version)" >> $GITHUB_ENV

    - name: Install uv
      if: inputs.skip-uv != 'true'
      # https://github.com/astral-sh/setup-uv
      uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
      with:
        version: ${{ env.UV_VERSION }}

    - name: Set uv cache-dir
      if: inputs.skip-uv != 'true'
      shell: bash
      run: |
        echo "UV_CACHE_DIR=$(uv cache dir)" >> $GITHUB_ENV

    - name: Cached uv
      # Skip on macOS: hashFiles() broken in composite actions after Nov 20 runner update
      # See: https://github.com/actions/runner/issues/3765
      if: runner.os != 'macOS' && inputs.skip-uv != 'true' && inputs.use-github-actions-cache == 'true'
      id: cached-uv
      # https://github.com/actions/cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: ${{ runner.os }}-${{ env.PYTHON_VERSION }}-uv-${{ hashFiles('**/uv.lock') }}

    # > --------------------------------------------------
    # > pre-commit
    - name: Cached pre-commit
      # Skip on macOS: hashFiles() broken in composite actions after Nov 20 runner update
      # See: https://github.com/actions/runner/issues/3765
      if: >-
        runner.os != 'macOS' &&
        (inputs.build-type == 'pre-commit' || inputs.build-type == 'rust-policy') &&
        inputs.use-github-actions-cache == 'true'
      id: cached-pre-commit
      # https://github.com/actions/cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-${{ env.PYTHON_VERSION }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
