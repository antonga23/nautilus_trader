name: pr-validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read

on:
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

env:
  USE_GITHUB_ACTIONS_CACHE: "false"
  CI_TRANSIENT_ARTIFACTS_ENABLED: "true"
  CI_TRANSIENT_R2_BUCKET: ${{ secrets.CI_TRANSIENT_R2_BUCKET_NAME }}
  CI_TRANSIENT_R2_PREFIX: ci-transient
  CI_TRANSIENT_R2_URL: ${{ secrets.CI_TRANSIENT_R2_URL }}
  CLOUDFLARE_R2_REGION: "auto"
  CI_TRANSIENT_R2_ACCESS_KEY_ID: ${{ secrets.CI_TRANSIENT_R2_ACCESS_KEY_ID }}
  CI_TRANSIENT_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_TRANSIENT_R2_SECRET_ACCESS_KEY }}

jobs:
  pre-commit-full:
    name: pre-commit-full
    timeout-minutes: 30
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      RUNNER_CI_HOME: ${{ github.workspace }}/../.ci-home
      HOME: ${{ github.workspace }}/../.ci-home
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          python-version: "3.13"
          free-disk-space: "false"
          build-type: "pre-commit"
          skip-rust: "true"
          skip-capnp: "true"
          use-github-actions-cache: "false"

      - name: Run full pre-commit suite (non-Rust)
        run: bash scripts/ci/run_pre_commit_full.sh --exclude-rust

  build-linux-x86-py312:
    name: build-linux-x86-py312
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [pre-commit-full]
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    container:
      image: >-
        ghcr.io/antonga23/cloudbet-market-maker/ci-runner@sha256:ed46e808744508e5627f3f8d32fc3eff6b0c047129af03db70a8a6225346235b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # This runner is shared with the live trading fleet. The release wheel
      # build is memory-hungry and the host has no swap, so an unbounded build
      # can exhaust RAM and livelock the whole box. Cap the build container so a
      # runaway compile is cgroup-OOM-killed (build fails) instead of taking the
      # host — and the fleet — down with it. Paired with CARGO_BUILD_JOBS below.
      options: >-
        --memory=24g
        --memory-swap=24g
        --cpus=6
    permissions:
      contents: read
      packages: read
    env:
      UV_PYTHON: "3.12"
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.12"
          build-type: "test"
          skip-uv: "true"
          skip-capnp: "true"
          skip-install-deps: "true"
          skip-setup-python: "true"
          force-rustup-update: "true"
          use-github-actions-cache: "false"

      - name: Ensure CI container build dependencies
        run: bash scripts/ci/ensure_ci_container_build_deps.sh

      - name: Verify self-hosted build toolchain
        run: |
          python3 --version
          uv --version
          git --version
          rustc --version
          cargo --version

      - name: Compute wheel cache key
        id: wheel-key
        run: echo "key=$(python3 scripts/ci/compute_test_wheel_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore self-hosted wheel cache
        id: local-wheel-cache
        run: bash scripts/ci/self_hosted_wheel_cache.sh restore "${{ steps.wheel-key.outputs.key }}"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --no-install-package nautilus_trader

      - name: Build wheel (on cache miss)
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: release
          CARGO_BUILD_JOBS: "6"
        run: |
          uv build --wheel --python 3.12
          ls -lh dist/

      - name: Install wheel
        run: uv pip install dist/*.whl

      - name: Save self-hosted wheel cache
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/self_hosted_wheel_cache.sh save "${{ steps.wheel-key.outputs.key }}"

      - name: Run smoke tests
        run: bash scripts/ci/run_installed_wheel_smoke_test.sh

      - name: Upload built wheel to transient CI storage
        run: |
          wheel_path="$(find dist -maxdepth 1 -name 'nautilus_trader-*.whl' -type f | sort | tail -n 1)"
          test -n "$wheel_path"
          bash scripts/ci/ci_transient_artifacts.sh \
            put "$wheel_path" "wheels/$(basename "$wheel_path")"

  python-tests:
    name: python-tests
    timeout-minutes: 90
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - pre-commit-full
      - build-linux-x86-py312
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    container:
      image: >-
        ghcr.io/antonga23/cloudbet-market-maker/ci-runner@sha256:ed46e808744508e5627f3f8d32fc3eff6b0c047129af03db70a8a6225346235b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      REDIS_HOST: redis
      PGHOST: postgres
      UV_PYTHON: "3.12"
      PYTEST_XDIST_WORKERS: "6"
      FULL_SUITE_PYTEST_XDIST_WORKERS: "4"
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      PGPASSWORD: pass
      PGUSER: nautilus
      PGDATABASE: nautilus
    services:
      postgres:
        image: postgres@sha256:f30e3de0ac9cc938dac627ef2231099867c694b5f949fadb924c8c977428c399
        env:
          POSTGRES_USER: nautilus
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nautilus
        options: >-
          --health-cmd "pg_isready -U nautilus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: >-
          public.ecr.aws/docker/library/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.12"
          build-type: "test"
          skip-rust: "true"
          skip-uv: "true"
          skip-capnp: "true"
          skip-install-deps: "true"
          skip-setup-python: "true"
          use-github-actions-cache: "false"

      - name: Ensure CI container build dependencies
        run: bash scripts/ci/ensure_ci_container_build_deps.sh

      - name: Verify self-hosted test toolchain
        run: |
          python3 --version
          uv --version
          git --version

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --no-install-package nautilus_trader

      - name: Compute wheel cache key
        id: wheel-key
        run: echo "key=$(python3 scripts/ci/compute_test_wheel_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore self-hosted wheel cache
        id: local-wheel-cache
        run: bash scripts/ci/self_hosted_wheel_cache.sh restore "${{ steps.wheel-key.outputs.key }}"

      - name: Download built wheel
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/ci_transient_artifacts.sh get-prefix wheels dist

      - name: Install wheel
        run: uv pip install dist/*.whl

      - name: Cached test data
        uses: ./.github/actions/common-test-data
        with:
          use-github-actions-cache: "false"

      - name: Inject compiled extensions into source tree
        run: python3 scripts/ci/extract_compiled_extensions_from_wheel.py dist/*.whl

      - name: Initialize Database Schema
        run: bash scripts/ci/initialize_database_schema.sh

      - name: Run Python test suites
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash scripts/ci/run_python_test_suites.sh

      - name: Upload Python test artifacts to transient CI storage
        if: failure()
        continue-on-error: true
        run: |
          if [ -d tests/results ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put tests/results diagnostics/python-tests-results
          fi
