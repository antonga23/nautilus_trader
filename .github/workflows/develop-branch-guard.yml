name: develop-branch-guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

on:
  push:
    branches: [develop]

jobs:
  enforce:
    timeout-minutes: 20
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      RUNNER_CI_HOME: ${{ github.workspace }}/../.ci-home
      HOME: ${{ github.workspace }}/../.ci-home
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Evaluate develop push policy
        id: policy
        continue-on-error: true
        env:
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/enforce_develop_push_policy.py \
            --repo "$REPO" \
            --event-path "$EVENT_PATH" \
            --output-json develop-guard-decision.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Show develop guard decision
        run: cat develop-guard-decision.json

      - name: Configure authenticated git remote
        if: steps.policy.outputs.action != 'allow'
        env:
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$REPO"

      - name: Revert unauthorized develop push
        if: steps.policy.outputs.action == 'revert_range'
        env:
          AFTER_SHA: ${{ steps.policy.outputs.after }}
          BEFORE_SHA: ${{ steps.policy.outputs.before }}
          POLICY_REASON: ${{ steps.policy.outputs.reason }}
        run: |
          set -euo pipefail
          before_sha="${BEFORE_SHA:-}"
          after_sha="${AFTER_SHA:-}"
          if [[ -z "$before_sha" || -z "$after_sha" ]]; then
            echo "Missing before/after SHAs for revert" >&2
            exit 1
          fi

          mapfile -t commits < <(git rev-list --reverse "${before_sha}..${after_sha}")
          if [[ "${#commits[@]}" -eq 0 ]]; then
            echo "No commits found to revert" >&2
            exit 1
          fi

          for (( idx=${#commits[@]}-1 ; idx>=0 ; idx-- )); do
            commit_sha="${commits[$idx]}"
            parent_count="$(git rev-list --parents -n 1 "$commit_sha" | awk '{print NF-1}')"
            if [[ "$parent_count" -gt 1 ]]; then
              git revert --no-edit --no-commit -m 1 "$commit_sha"
            else
              git revert --no-edit --no-commit "$commit_sha"
            fi
          done

          git commit \
            -m "[develop-guard] Revert unauthorized develop push ${after_sha}" \
            -m "$POLICY_REASON"
          git push origin HEAD:develop

      - name: Restore previous develop ref after forced push
        if: steps.policy.outputs.action == 'restore_ref'
        env:
          BEFORE_SHA: ${{ steps.policy.outputs.before }}
        run: |
          set -euo pipefail
          before_sha="${BEFORE_SHA:-}"
          if [[ -z "$before_sha" ]]; then
            echo "Missing previous develop SHA for forced-push restore" >&2
            exit 1
          fi
          git push --force-with-lease origin "${before_sha}:develop"

      - name: Fail on policy violation
        if: steps.policy.outputs.action != 'allow'
        env:
          POLICY_REASON: ${{ steps.policy.outputs.reason }}
        run: |
          echo "Develop branch policy violation: $POLICY_REASON" >&2
          exit 1
