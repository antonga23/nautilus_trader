name: upstream-mirror-sync

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  upstream-sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub push access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Sync upstream mirror branches
        env:
          UPSTREAM_URL: https://github.com/nautechsystems/nautilus_trader.git
        run: bash scripts/upstream/sync_upstream_mirrors.sh

      - name: Prepare develop reconciliation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: nautilus_develop
          TARGET_BRANCH: develop
          SYNC_BRANCH: sync/upstream-develop-to-develop
          PR_TITLE: "chore(sync): reconcile upstream develop into develop"
        run: bash scripts/upstream/prepare_reconciliation_pr.sh

      - name: Prepare production reconciliation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: nautilus_master
          TARGET_BRANCH: production
          SYNC_BRANCH: sync/upstream-master-to-production
          PR_TITLE: "chore(sync): reconcile upstream master into production"
        run: bash scripts/upstream/prepare_reconciliation_pr.sh
