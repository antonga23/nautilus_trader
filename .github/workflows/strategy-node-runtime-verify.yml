name: strategy-node-runtime-verify

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      container_name:
        description: Target strategy-node container name
        required: false
        default: betting-arbitrage-node-sxbet
      root_dir:
        description: Host root containing strategy-node runtime artifacts
        required: false
        default: /opt/cloudbet/strategy-nodes
      expected_session_id:
        description: Optional expected current session id from the triggering deploy
        required: false
        default: ''
      timeout_seconds:
        description: Status wait timeout in seconds
        required: false
        default: '900'
      heartbeat_updates_required:
        description: Number of heartbeat timestamp changes required after verification starts
        required: false
        default: '2'
      min_cross_venue_candidates:
        description: Minimum cross-venue quoted semantic candidates required in runtimeProbe
        required: false
        default: '0'
      min_quoted_node_counts:
        description: Comma-separated VENUE:COUNT requirements for runtimeProbe.venueCoverage.quotedNodeCounts
        required: false
        default: ''
      semantic_verify_enabled:
        description: Run semantic completion verification against the deployed file-backed cache
        required: false
        default: 'false'
      semantic_verify_required_providers:
        description: Comma-separated provider list for semantic completion verification
        required: false
        default: ''
      semantic_verify_target_sports:
        description: Comma-separated sport list for semantic completion verification
        required: false
        default: ''
      semantic_verify_min_candidates:
        description: Minimum per-sport event candidate count for semantic completion verification
        required: false
        default: '10'
      semantic_verify_target_candidates:
        description: Target per-sport event candidate count for semantic completion verification
        required: false
        default: '20'

jobs:
  verify-runtime:
    name: verify-runtime
    timeout-minutes: 30
    runs-on: [self-hosted, linux, x64, ec2, deploy, trading]
    steps:
      - name: Repair self-hosted workspace
        shell: bash
        env:
          ACTIONS_RUNNER_ROOT: /home/ubuntu/actions-runner
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Verify deployed strategy-node runtime
        shell: bash
        env:
          INPUT_CONTAINER_NAME: ${{ github.event.inputs.container_name }}
          INPUT_ROOT_DIR: ${{ github.event.inputs.root_dir }}
          INPUT_EXPECTED_SESSION_ID: ${{ github.event.inputs.expected_session_id }}
          INPUT_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds }}
          INPUT_HEARTBEAT_UPDATES_REQUIRED: ${{ github.event.inputs.heartbeat_updates_required }}
          INPUT_MIN_CROSS_VENUE_CANDIDATES: ${{ github.event.inputs.min_cross_venue_candidates }}
          INPUT_MIN_QUOTED_NODE_COUNTS: ${{ github.event.inputs.min_quoted_node_counts }}
          INPUT_SEMANTIC_VERIFY_ENABLED: ${{ github.event.inputs.semantic_verify_enabled }}
          INPUT_SEMANTIC_VERIFY_REQUIRED_PROVIDERS: ${{ github.event.inputs.semantic_verify_required_providers }}
          INPUT_SEMANTIC_VERIFY_TARGET_SPORTS: ${{ github.event.inputs.semantic_verify_target_sports }}
          INPUT_SEMANTIC_VERIFY_MIN_CANDIDATES: ${{ github.event.inputs.semantic_verify_min_candidates }}
          INPUT_SEMANTIC_VERIFY_TARGET_CANDIDATES: ${{ github.event.inputs.semantic_verify_target_candidates }}
        run: |
          set -euo pipefail

          container_name="${INPUT_CONTAINER_NAME:-betting-arbitrage-node-sxbet}"
          root_dir="${INPUT_ROOT_DIR:-/opt/cloudbet/strategy-nodes}"
          expected_session_id="${INPUT_EXPECTED_SESSION_ID:-}"
          timeout_seconds="${INPUT_TIMEOUT_SECONDS:-900}"
          heartbeat_updates_required="${INPUT_HEARTBEAT_UPDATES_REQUIRED:-2}"
          min_cross_venue_candidates="${INPUT_MIN_CROSS_VENUE_CANDIDATES:-0}"
          min_quoted_node_counts="${INPUT_MIN_QUOTED_NODE_COUNTS:-}"
          semantic_verify_enabled="${INPUT_SEMANTIC_VERIFY_ENABLED:-false}"
          semantic_verify_required_providers="${INPUT_SEMANTIC_VERIFY_REQUIRED_PROVIDERS:-}"
          semantic_verify_target_sports="${INPUT_SEMANTIC_VERIFY_TARGET_SPORTS:-}"
          semantic_verify_min_candidates="${INPUT_SEMANTIC_VERIFY_MIN_CANDIDATES:-10}"
          semantic_verify_target_candidates="${INPUT_SEMANTIC_VERIFY_TARGET_CANDIDATES:-20}"

          node_dir="$root_dir/$container_name"
          status_file="$node_dir/status.json"
          heartbeat_file="$node_dir/heartbeat.json"
          current_session_file="$node_dir/current-session.json"

          persist_node_runtime_artifacts() {
            set +e
            artifact_dir="artifacts/strategy-node-runtime-verify/$container_name"
            mkdir -p "$artifact_dir"
            for source_target in \
              "$status_file:$artifact_dir/status.json" \
              "$heartbeat_file:$artifact_dir/heartbeat.json" \
              "$current_session_file:$artifact_dir/current-session.json" \
              "$node_dir/manifest.runtime.json:$artifact_dir/manifest.runtime.json" \
              "$node_dir/release.json:$artifact_dir/release.json"; do
              source_path="${source_target%%:*}"
              target_path="${source_target#*:}"
              if [ -f "$source_path" ]; then
                cp "$source_path" "$target_path"
              fi
            done

            current_log_path=""
            current_event_log_path=""
            if [ -f "$current_session_file" ]; then
              current_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload.get("logPath") or "")
          PY
              )"
              current_event_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload.get("eventLogPath") or "")
          PY
              )"
            fi
            if [ -n "$current_log_path" ] && [ -f "$current_log_path" ]; then
              cp "$current_log_path" "$artifact_dir/node.log"
            fi
            if [ -n "$current_event_log_path" ] && [ -f "$current_event_log_path" ]; then
              cp "$current_event_log_path" "$artifact_dir/events.jsonl"
            fi
            if [ -f "$status_file" ]; then
              python3 - "$status_file" "$artifact_dir/runtime-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          status = json.loads(pathlib.Path(sys.argv[1]).read_text())
          runtime_probe = status.get("runtimeProbe") or {}
          candidate_quality = runtime_probe.get("candidateQuality") or {}
          runtime_probe_summary = dict(runtime_probe) if isinstance(runtime_probe, dict) else {}
          if isinstance(candidate_quality, dict):
              runtime_probe_summary["candidateQuality"] = dict(candidate_quality)
              for key in (
                  "blockerSamples",
                  "latencyHistograms",
                  "liveTimingSlo",
                  "semanticBlockedRelationships",
                  "topNegativeNearMisses",
                  "topPositiveCandidates",
                  "venueQuoteHealth",
                  "zeroCandidateBlockerCounts",
                  "zeroCandidateVenuePairSamples",
              ):
                  runtime_probe_summary["candidateQuality"][key] = candidate_quality.get(key)
          for key in (
              "coverageDiagnostics",
              "latencyDiagnostics",
              "providerQuotePollStats",
              "instrumentRefresh",
              "semanticDiagnostics",
          ):
              runtime_probe_summary[key] = runtime_probe.get(key)
          summary = {
              "nodeId": status.get("nodeId"),
              "status": status.get("status"),
              "semanticCache": status.get("semanticCache"),
              "executionReadiness": status.get("executionReadiness"),
              "runtimeProbe": runtime_probe_summary,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(summary, indent=2, sort_keys=True))
          PY
            fi
            set -e
          }

          dump_node_runtime_artifacts() {
            set +e
            persist_node_runtime_artifacts
            set +e
            echo
            echo "runtime_diagnostics<<EOF"
            echo "container=$container_name"
            echo "node_dir=$node_dir"
            if docker inspect "$container_name" > /dev/null 2>&1; then
              docker_format='docker_state={{.State.Status}}'
              docker_format+=' docker_running={{.State.Running}}'
              docker_format+=' docker_image={{.Config.Image}}'
              docker inspect \
                --format "$docker_format" \
                "$container_name"
            else
              echo "docker_container_missing=true"
            fi
            for path in \
              "$status_file" \
              "$heartbeat_file" \
              "$current_session_file" \
              "$node_dir/manifest.runtime.json" \
              "$node_dir/release.json"; do
              if [ -f "$path" ]; then
                echo
                echo "file=$path"
                cat "$path"
              else
                echo
                echo "missing=$path"
              fi
            done
            if [ -f "$current_session_file" ]; then
              python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          for key in ("logPath", "eventLogPath"):
              raw_path = payload.get(key)
              if raw_path:
                  print(f"{key}={raw_path}")
          PY
              current_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload.get("logPath") or "")
          PY
              )"
              current_event_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload.get("eventLogPath") or "")
          PY
              )"
              if [ -n "$current_log_path" ] && [ -f "$current_log_path" ]; then
                echo
                echo "node_log_tail"
                tail -n 120 "$current_log_path"
              fi
              if [ -n "$current_event_log_path" ] && [ -f "$current_event_log_path" ]; then
                echo
                echo "events_tail"
                tail -n 80 "$current_event_log_path"
              fi
            fi
            echo "EOF"
            set -e
          }

          trap 'status=$?; if [ "$status" -ne 0 ]; then dump_node_runtime_artifacts; fi' EXIT

          test -d "$node_dir"

          quoted_node_args=()
          if [ -n "$min_quoted_node_counts" ]; then
            IFS=',' read -r -a raw_requirements <<< "$min_quoted_node_counts"
            for raw_requirement in "${raw_requirements[@]}"; do
              requirement="$(printf '%s' "$raw_requirement" | xargs)"
              if [ -n "$requirement" ]; then
                quoted_node_args+=(--min-quoted-node-count "$requirement")
              fi
            done
          fi

          bash scripts/deploy/strategy_nodes/wait_for_strategy_node_status.sh \
            --status-file "$status_file" \
            --timeout-seconds "$timeout_seconds" \
            --success-status running \
            --require-semantic-cache-ready \
            --require-runtime-probe \
            --require-rust-semantic-topology \
            --min-connected-nodes 2 \
            --min-match-instruments 2 \
            --min-quoted-match-instruments 2 \
            --min-positive-margin-candidates 0 \
            --min-cross-venue-candidates "$min_cross_venue_candidates" \
            "${quoted_node_args[@]}"

          docker_state="$(docker inspect --format '{{.State.Status}}' "$container_name")"
          docker_running="$(docker inspect --format '{{.State.Running}}' "$container_name")"
          docker_image="$(docker inspect --format '{{.Config.Image}}' "$container_name")"
          echo "container=$container_name"
          echo "docker_state=$docker_state"
          echo "docker_running=$docker_running"
          echo "docker_image=$docker_image"

          if [[ "$docker_running" != "true" ]]; then
            echo "Container is not running" >&2
            exit 1
          fi

          python3 - \
            "$status_file" \
            "$heartbeat_file" \
            "$current_session_file" \
            "$expected_session_id" \
            "$heartbeat_updates_required" <<'PY'
          import json
          import pathlib
          import sys
          import time

          status_path = pathlib.Path(sys.argv[1])
          heartbeat_path = pathlib.Path(sys.argv[2])
          current_session_path = pathlib.Path(sys.argv[3])
          expected_session_id = sys.argv[4].strip()
          heartbeat_updates_required = int(sys.argv[5])

          def load_json(path: pathlib.Path) -> dict:
              if not path.exists():
                  raise SystemExit(f"Missing required file: {path}")
              return json.loads(path.read_text())

          status_payload = load_json(status_path)
          if status_payload.get("status") != "running":
              raise SystemExit(
                  f"Expected running status, found {status_payload.get('status')!r} in {status_path}",
              )

          session_payload = load_json(current_session_path)
          session_id = session_payload.get("sessionId")
          if not session_id:
              raise SystemExit(f"current-session.json missing sessionId: {current_session_path}")
          if expected_session_id and session_id != expected_session_id:
              raise SystemExit(
                  f"Expected current session {expected_session_id}, found {session_id}",
              )

          log_path = pathlib.Path(session_payload.get("logPath") or "")
          event_log_path = pathlib.Path(session_payload.get("eventLogPath") or "")
          if not log_path.exists():
              raise SystemExit(f"Missing node log file: {log_path}")
          if not event_log_path.exists():
              raise SystemExit(f"Missing event log file: {event_log_path}")

          heartbeat_payload = load_json(heartbeat_path)
          initial_heartbeat_at = heartbeat_payload.get("at")
          if not initial_heartbeat_at:
              raise SystemExit(f"heartbeat.json missing at field: {heartbeat_path}")

          heartbeat_history = [initial_heartbeat_at]
          deadline = time.time() + 45
          while time.time() < deadline and len(heartbeat_history) - 1 < heartbeat_updates_required:
              time.sleep(2)
              heartbeat_payload = load_json(heartbeat_path)
              current_at = heartbeat_payload.get("at")
              if current_at and current_at != heartbeat_history[-1]:
                  heartbeat_history.append(current_at)

          observed_updates = len(heartbeat_history) - 1
          if observed_updates < heartbeat_updates_required:
              raise SystemExit(
                  "Heartbeat did not update enough times after verification started "
                  f"(required={heartbeat_updates_required}, observed={observed_updates}, "
                  f"history={heartbeat_history})",
              )

          event_lines = [
              json.loads(line)
              for line in event_log_path.read_text().splitlines()
              if line.strip()
          ]
          event_names = [entry.get("event") for entry in event_lines]
          required_events = {"deploy_started", "container_started", "process_started"}
          missing_events = sorted(required_events.difference(event_names))
          if missing_events:
              raise SystemExit(f"Missing required lifecycle events: {missing_events}")
          terminal_failures = [name for name in event_names if name and "failed" in name.lower()]
          if terminal_failures:
              raise SystemExit(f"Found failure events in lifecycle log: {terminal_failures}")

          log_text = log_path.read_text(encoding="utf8")
          error_markers = ("Traceback", "Fatal Python error", "panic", "uncaught exception")
          found_error_markers = [marker for marker in error_markers if marker in log_text]
          if found_error_markers:
              raise SystemExit(
                  f"Node log contains uncaught error markers: {found_error_markers}",
              )

          summary = {
              "status": status_payload.get("status"),
              "statusPath": str(status_path),
              "heartbeatPath": str(heartbeat_path),
              "heartbeatHistory": heartbeat_history,
              "currentSessionPath": str(current_session_path),
              "sessionId": session_id,
              "logPath": str(log_path),
              "eventLogPath": str(event_log_path),
              "eventNames": event_names,
              "logLineCount": len(log_text.splitlines()),
          }
          print(json.dumps(summary, indent=2))
          PY

          python3 - "$status_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          runtime_probe = payload.get("runtimeProbe") or {}
          semantic_cache = payload.get("semanticCache") or {}
          candidate_quality = runtime_probe.get("candidateQuality") or {}
          summary = {
              "nodeId": payload.get("nodeId"),
              "status": payload.get("status"),
              "semanticCache": {
                  "ready": semantic_cache.get("ready"),
                  "source": semantic_cache.get("source"),
                  "manifestCount": semantic_cache.get("manifestCount"),
                  "promotedTemplateCount": semantic_cache.get("promotedTemplateCount"),
                  "executionSafeTemplateCount": semantic_cache.get("executionSafeTemplateCount"),
                  "sameVenueExecutionEligibleTemplateCount": semantic_cache.get(
                      "sameVenueExecutionEligibleTemplateCount",
                  ),
              },
              "runtimeProbe": {
                  "elapsedSeconds": runtime_probe.get("elapsedSeconds"),
                  "graphEngine": runtime_probe.get("graphEngine"),
                  "topologySource": runtime_probe.get("topologySource"),
                  "semanticTemplateCount": runtime_probe.get("semanticTemplateCount"),
                  "coverageProofCount": runtime_probe.get("coverageProofCount"),
                  "coverageHyperedgeCount": runtime_probe.get("coverageHyperedgeCount"),
                  "graphNodes": runtime_probe.get("graphNodes"),
                  "graphEdges": runtime_probe.get("graphEdges"),
                  "graphQuoteStates": runtime_probe.get("graphQuoteStates"),
                  "connectedNodes": runtime_probe.get("connectedNodes"),
                  "semanticMatchInstruments": runtime_probe.get("semanticMatchInstruments"),
                  "quotedSemanticMatchInstruments": runtime_probe.get(
                      "quotedSemanticMatchInstruments",
                  ),
                  "quotedEdges": runtime_probe.get("quotedEdges"),
                  "positiveMarginCandidates": runtime_probe.get("positiveMarginCandidates"),
                  "thresholdMarginCandidates": runtime_probe.get("thresholdMarginCandidates"),
                  "venueCoverage": runtime_probe.get("venueCoverage"),
                  "candidateQuality": {
                      "quotedEdges": candidate_quality.get("quotedEdges"),
                      "marginBands": candidate_quality.get("marginBands"),
                      "rejectionBuckets": candidate_quality.get("rejectionBuckets"),
                      "venuePairs": candidate_quality.get("venuePairs"),
                      "marketFamilies": candidate_quality.get("marketFamilies"),
                  },
              },
          }
          print("runtime_probe_summary<<EOF")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("EOF")
          PY

          current_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload["logPath"])
          PY
          )"
          current_event_log_path="$(python3 - "$current_session_file" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(payload["eventLogPath"])
          PY
          )"

          echo
          echo "node_log_tail<<EOF"
          tail -n 40 "$current_log_path"
          echo "EOF"
          echo
          echo "events_tail<<EOF"
          tail -n 40 "$current_event_log_path"
          echo "EOF"

          artifact_dir="artifacts/strategy-node-runtime-verify/$container_name"
          persist_node_runtime_artifacts

          if [[ "${semantic_verify_enabled,,}" == "true" ]]; then
            cache_dir="$node_dir/semantic-rule-cache"
            semantic_args=(
              scripts/deploy/strategy_nodes/verify_semantic_cache_completion.py
              --cache-dir "$cache_dir"
              --min-candidates "$semantic_verify_min_candidates"
              --target-candidates "$semantic_verify_target_candidates"
            )
            if [[ -n "$semantic_verify_required_providers" ]]; then
              IFS=',' read -r -a raw_providers <<< "$semantic_verify_required_providers"
              for raw_provider in "${raw_providers[@]}"; do
                provider="$(printf '%s' "$raw_provider" | xargs)"
                if [[ -n "$provider" ]]; then
                  semantic_args+=(--required-provider "$provider")
                fi
              done
            fi
            if [[ -n "$semantic_verify_target_sports" ]]; then
              IFS=',' read -r -a raw_sports <<< "$semantic_verify_target_sports"
              for raw_sport in "${raw_sports[@]}"; do
                sport="$(printf '%s' "$raw_sport" | xargs)"
                if [[ -n "$sport" ]]; then
                  semantic_args+=(--target-sport "$sport")
                fi
              done
            fi
            semantic_completion_stderr="$artifact_dir/semantic-completion.stderr"
            semantic_python=(python3)
            if command -v sudo >/dev/null 2>&1; then
              semantic_python=(sudo -n python3)
            fi
            set +e
            "${semantic_python[@]}" "${semantic_args[@]}" \
              > "$artifact_dir/semantic-completion.json" \
              2> "$semantic_completion_stderr"
            semantic_completion_rc=$?
            set -e
            if [[ ! -s "$artifact_dir/semantic-completion.json" ]]; then
              python3 - "$semantic_completion_rc" "$semantic_completion_stderr" "$artifact_dir/semantic-completion.json" <<'PY'
          import json
          import pathlib
          import sys

          return_code = int(sys.argv[1])
          stderr_path = pathlib.Path(sys.argv[2])
          output_path = pathlib.Path(sys.argv[3])
          stderr_text = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
          output_path.write_text(
              json.dumps(
                  {
                      "passed": False,
                      "error": "semantic_completion_verifier_failed_before_json_output",
                      "return_code": return_code,
                      "stderr_tail": stderr_text[-4000:],
                  },
                  indent=2,
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
            fi
            echo
            echo "semantic_completion_summary<<EOF"
            cat "$artifact_dir/semantic-completion.json"
            echo "EOF"
            if [[ "$semantic_completion_rc" -ne 0 ]]; then
              exit "$semantic_completion_rc"
            fi
          fi

      - name: Upload runtime verification artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: strategy-node-runtime-verify-${{ github.event.inputs.container_name }}
          path: artifacts/strategy-node-runtime-verify
          if-no-files-found: ignore
