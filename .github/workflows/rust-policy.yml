name: rust-policy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [develop, production]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'supply-chain/**'
      - 'rust-toolchain.toml'
      - 'capnp-version'
      - '.pre-commit-config.yaml'
      - '.pre-commit-hooks/**'
      - '.github/workflows/rust-policy.yml'
      - '.github/actions/common-setup/action.yml'
      - '.github/actions/cargo-tool-install/action.yml'
      - 'scripts/ci/install-rust.sh'
      - 'scripts/ci/run_rust_policy.sh'
  push:
    branches: [develop, production]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'supply-chain/**'
      - 'rust-toolchain.toml'
      - 'capnp-version'
      - '.pre-commit-config.yaml'
      - '.pre-commit-hooks/**'
      - '.github/workflows/rust-policy.yml'
      - '.github/actions/common-setup/action.yml'
      - '.github/actions/cargo-tool-install/action.yml'
      - 'scripts/ci/install-rust.sh'
      - 'scripts/ci/run_rust_policy.sh'
  workflow_dispatch:

env:
  USE_GITHUB_ACTIONS_CACHE: "false"
  CI_TRANSIENT_ARTIFACTS_ENABLED: "true"
  CI_TRANSIENT_R2_BUCKET: ${{ secrets.CI_TRANSIENT_R2_BUCKET_NAME }}
  CI_TRANSIENT_R2_PREFIX: ci-transient
  CI_TRANSIENT_R2_URL: ${{ secrets.CI_TRANSIENT_R2_URL }}
  CLOUDFLARE_R2_REGION: "auto"
  CI_TRANSIENT_R2_ACCESS_KEY_ID: ${{ secrets.CI_TRANSIENT_R2_ACCESS_KEY_ID }}
  CI_TRANSIENT_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_TRANSIENT_R2_SECRET_ACCESS_KEY }}

jobs:
  rust-policy:
    timeout-minutes: 30
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      RUNNER_CI_HOME: /tmp/cloudbet-market-maker-ci-home
      HOME: /tmp/cloudbet-market-maker-ci-home
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "false"
          build-type: "rust-policy"
          skip-uv: "true"
          use-github-actions-cache: "false"

      - name: Install cargo-deny
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-deny
          use-github-actions-cache: "false"

      - name: Install cargo-vet
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-vet
          use-github-actions-cache: "false"

      - name: Run rust policy
        env:
          CI_ARTIFACTS_DIR: artifacts/rust-policy
          RUN_CAPNP_SCHEMAS: "true"
        run: bash scripts/ci/run_rust_policy.sh

      - name: Upload rust policy artifacts to transient CI storage
        if: failure()
        continue-on-error: true
        run: |
          if [ -d artifacts/rust-policy ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put artifacts/rust-policy diagnostics/rust-policy
          fi
