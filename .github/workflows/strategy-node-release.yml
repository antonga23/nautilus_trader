name: strategy-node-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Manifest to validate and, when enabled, deploy
        required: false
        default: deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json
      deploy_enabled:
        description: Actually deploy to the target host
        required: false
        default: 'false'
      image_tag:
        description: Optional explicit image tag override
        required: false
        default: ''
      container_name:
        description: Target strategy-node container name
        required: false
        default: betting-arbitrage-node-sxbet
      image_transport:
        description: 'How the deploy job gets the built image onto EC2: archive or registry'
        required: false
        default: archive
      force_rebuild:
        description: Rebuild the strategy-node image archive even when an R2 archive already exists
        required: false
        default: 'false'
      live_execution_armed:
        description: Explicitly arm live execution for manifests that also opt in
        required: false
        default: 'false'
      semantic_cache_mode:
        description: >-
          Override the node semantic_rule_cache_mode for this deploy
          (fresh|reuse|default). Empty keeps the manifest's declared value
          (node default is fresh = re-mine, never silently reuse a stale cache).
        required: false
        default: ''
      semantic_cache_default_root:
        description: >-
          Config-signature default-mine registry root for semantic_rule_cache_mode=default
          (mine once per trading-node config, reuse across deploys). Empty keeps the manifest value.
        required: false
        default: ''

permissions:
  actions: read
  contents: read

env:
  USE_GITHUB_ACTIONS_CACHE: "false"
  CI_TRANSIENT_ARTIFACTS_ENABLED: "true"
  CI_TRANSIENT_R2_BUCKET: ${{ secrets.CI_TRANSIENT_R2_BUCKET_NAME }}
  CI_TRANSIENT_R2_PREFIX: ci-transient
  CI_TRANSIENT_R2_URL: ${{ secrets.CI_TRANSIENT_R2_URL }}
  CLOUDFLARE_R2_REGION: "auto"
  CI_TRANSIENT_R2_ACCESS_KEY_ID: ${{ secrets.CI_TRANSIENT_R2_ACCESS_KEY_ID }}
  CI_TRANSIENT_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_TRANSIENT_R2_SECRET_ACCESS_KEY }}

jobs:
  validate-manifests:
    name: validate-strategy-node-manifests
    timeout-minutes: 45
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      UV_PYTHON: "3.12"
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
      SXBET_PRIVATE_KEY: ${{ secrets.SXBET_PRIVATE_KEY }}
      SXBET_WALLET_ADDRESS: ${{ secrets.SXBET_WALLET_ADDRESS }}
      CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_PK: ${{ secrets.POLYMARKET_PK }}
      POLYMARKET_FUNDER: ${{ secrets.POLYMARKET_FUNDER }}
      POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
      POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
      POLYMARKET_PASSPHRASE: ${{ secrets.POLYMARKET_PASSPHRASE }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: '3.12'
          free-disk-space: 'false'
          build-type: 'test'
          use-github-actions-cache: 'false'

      - name: Compute wheel cache key
        id: wheel-key
        run: echo "key=$(python3 scripts/ci/compute_test_wheel_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore self-hosted wheel cache
        id: local-wheel-cache
        run: bash scripts/ci/self_hosted_wheel_cache.sh restore "${{ steps.wheel-key.outputs.key }}"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --no-install-package nautilus_trader

      - name: Build wheel on cache miss
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: release
        run: |
          uv build --wheel --python 3.12
          ls -lh dist/

      - name: Install wheel
        run: uv pip install dist/*.whl

      - name: Overlay branch strategy-node sources onto installed wheel
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import shutil
          import sysconfig
          from pathlib import Path

          workspace = Path.cwd()
          purelib = Path(sysconfig.get_paths()["purelib"])
          overlays = [
              (
                  workspace / "nautilus_trader/live/strategy_nodes/betting_arbitrage",
                  purelib / "nautilus_trader/live/strategy_nodes/betting_arbitrage",
              ),
              (
                  workspace / "nautilus_trader/adapters/betting",
                  purelib / "nautilus_trader/adapters/betting",
              ),
              (
                  workspace / "nautilus_trader/examples/strategies/betting_arbitrage.py",
                  purelib / "nautilus_trader/examples/strategies/betting_arbitrage.py",
              ),
              (
                  workspace / "nautilus_trader/examples/strategies/opportunity_graph.py",
                  purelib / "nautilus_trader/examples/strategies/opportunity_graph.py",
              ),
          ]

          for source, destination in overlays:
              if source.is_dir():
                  shutil.copytree(source, destination, dirs_exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
          PY

      - name: Patch cached wheel with checked-out Python sources
        if: steps.local-wheel-cache.outputs.cache-hit == 'true'
        run: |
          wheel_path="$(find dist -maxdepth 1 -name 'nautilus_trader-*.whl' -type f | sort | tail -n 1)"
          test -n "$wheel_path"
          python3 scripts/ci/patch_wheel_python_sources.py "$wheel_path"
          ls -lh dist/

      - name: Build validated wheel from checked-out source
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: release
        run: |
          rm -f dist/*.whl
          uv build --wheel --python 3.12
          ls -lh dist/

      - name: Install validated wheel
        run: uv pip install --force-reinstall --no-deps dist/*.whl

      - name: Save self-hosted wheel cache
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/self_hosted_wheel_cache.sh save "${{ steps.wheel-key.outputs.key }}"

      - name: Upload validated wheel to transient CI storage
        run: |
          wheel_path="$(find dist -maxdepth 1 -name 'nautilus_trader-*.whl' -type f | sort | tail -n 1)"
          test -n "$wheel_path"
          bash scripts/ci/ci_transient_artifacts.sh \
            put "$wheel_path" "strategy-node-wheel/$(basename "$wheel_path")"

      - name: Validate SX.bet manifest
        env:
          SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json"

      - name: Validate SX.bet testnet execution-readiness manifest
        env:
          SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
          SXBET_TESTNET_MANIFEST: >-
            ${{ github.workspace }}/deploy/strategy_nodes/betting_arbitrage/sxbet-testnet-execution-readiness.json
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$SXBET_TESTNET_MANIFEST"

      - name: Probe SX.bet runtime semantic coverage
        env:
          SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            probe-runtime \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json" \
            --timeout-seconds 420 \
            --poll-interval-secs 5 \
            --min-connected-nodes 2 \
            --min-match-instruments 2 \
            --min-quoted-match-instruments 2 \
            --min-positive-margin-candidates 0 \
            --require-rust-semantic-topology

      - name: Validate Cloudbet manifest
        env:
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/cloudbet-single-venue.json"

      - name: Validate Cloudbet execution-readiness manifest
        env:
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/cloudbet-execution-readiness.json"

      - name: Probe Cloudbet runtime semantic coverage
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.manifest_path ==
          'deploy/strategy_nodes/betting_arbitrage/cloudbet-single-venue.json'
        env:
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            probe-runtime \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/cloudbet-single-venue.json" \
            --timeout-seconds 420 \
            --poll-interval-secs 5 \
            --min-connected-nodes 2 \
            --min-match-instruments 2 \
            --min-quoted-match-instruments 2 \
            --min-positive-margin-candidates 0 \
            --require-rust-semantic-topology

      - name: Validate Polymarket manifest
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/polymarket-single-venue.json"

      - name: Validate Polymarket multi-venue example
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/polymarket-plus-sxbet.example.json"

      - name: Validate selected dispatch manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          cd /tmp
          manifest_path="${INPUT_MANIFEST_PATH:-deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json}"
          case "$manifest_path" in
            deploy/strategy_nodes/*.json) ;;
            *)
              echo "Manifest path must stay under deploy/strategy_nodes and point to a JSON file" >&2
              exit 1
              ;;
          esac
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/$manifest_path"

      - name: Probe selected multi-venue runtime semantic coverage
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.manifest_path ==
          'deploy/strategy_nodes/betting_arbitrage/multi-venue-validation.json'
        env:
          SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
          CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_PK: ${{ secrets.POLYMARKET_PK }}
          POLYMARKET_FUNDER: ${{ secrets.POLYMARKET_FUNDER }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_PASSPHRASE: ${{ secrets.POLYMARKET_PASSPHRASE }}
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            probe-runtime \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/multi-venue-validation.json" \
            --timeout-seconds 600 \
            --poll-interval-secs 5 \
            --min-connected-nodes 2 \
            --min-match-instruments 2 \
            --min-quoted-match-instruments 2 \
            --min-quoted-node-count SXBET:2 \
            --min-quoted-node-count POLYMARKET:2 \
            --require-cross-venue-candidates-or-blockers \
            --min-positive-margin-candidates 1 \
            --require-rust-semantic-topology

      - name: Upload rendered strategy-node artifacts to transient CI storage
        if: failure()
        continue-on-error: true
        run: |
          if [ -d artifacts/strategy-nodes ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put artifacts/strategy-nodes diagnostics/strategy-nodes
          fi
          if [ -d /tmp/artifacts/strategy-nodes ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put /tmp/artifacts/strategy-nodes diagnostics/strategy-nodes
          fi

  check-deploy-runner:
    name: check-ec2-deploy-runner
    timeout-minutes: 5
    needs: [validate-manifests]
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.github.com:443

      - name: Check EC2 deploy runner availability
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ github.event.inputs.deploy_enabled || '' }}
        run: |
          set -euo pipefail

          deploy_requested="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${DEPLOY_ENABLED}" == "true" ]]; then
            deploy_requested="true"
          fi

          if [[ "$deploy_requested" != "true" ]]; then
            echo "Deploy was not requested; EC2 runner availability is informational."
            exit 0
          fi

          response_file="$(mktemp)"
          http_code="$(
            curl -sS -L \
              -o "$response_file" \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100"
          )"
          if [[ "$http_code" == "403" ]]; then
            echo "::warning::GitHub token cannot list repository runners; continuing "\
              "so the EC2 deploy job can queue normally."
            exit 0
          fi
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "GitHub runner inventory request failed with HTTP $http_code" >&2
            cat "$response_file" >&2 || true
            exit 1
          fi
          response="$(cat "$response_file")"
          RUNNER_RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["RUNNER_RESPONSE"])
          required = {"self-hosted", "Linux", "X64", "ec2", "deploy", "trading"}
          matching = []
          for runner in payload.get("runners", []):
              labels = {label.get("name") for label in runner.get("labels", [])}
              if required.issubset(labels):
                  matching.append(
                      {
                          "name": runner.get("name"),
                          "status": runner.get("status"),
                          "busy": runner.get("busy"),
                      },
                  )

          if not matching:
              print("No EC2 deploy runner with required labels was found.", file=sys.stderr)
              sys.exit(1)

          online = [runner for runner in matching if runner.get("status") == "online"]
          print(f"matching_ec2_deploy_runners={matching}")
          if not online:
              print(
                  "All EC2 deploy runners are offline; failing before image build to avoid "
                  "a queued deploy job.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

  build-strategy-node-image:
    name: build-strategy-node-image
    timeout-minutes: 45
    needs: [validate-manifests, check-deploy-runner]
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      STRATEGY_NODE_GHCR_USERNAME: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME }}
      STRATEGY_NODE_GHCR_TOKEN: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_archive_key: ${{ steps.meta.outputs.image_archive_key }}
      image_archive_namespace: ${{ steps.meta.outputs.image_archive_namespace }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          allowed-endpoints: |
            auth.docker.io:443
            production.cloudflare.docker.com:443
            ghcr.io:443
            index.docker.io:443
            registry-1.docker.io:443

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify GCP runner toolchain
        run: |
          python3 --version
          git --version
          docker --version

      - name: Download validated wheel
        run: bash scripts/ci/ci_transient_artifacts.sh get-prefix strategy-node-wheel dist

      - name: Log in to GHCR
        if: >-
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport != 'archive')
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME || github.actor }}
          password: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN || github.token }}

      - name: Resolve image reference
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            case "$INPUT_IMAGE_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "Invalid image tag override: $INPUT_IMAGE_TAG" >&2
                exit 1
                ;;
            esac
            tag="$INPUT_IMAGE_TAG"
          else
            tag="${GITHUB_SHA::12}"
          fi
          image_ref="ghcr.io/${REPOSITORY_OWNER}/cloudbet-market-maker/betting-arbitrage-node:${tag}"
          {
            echo "image_ref=$image_ref"
            echo "image_tag=$tag"
            echo "image_archive_key=betting-arbitrage-node.tar.gz"
            echo "image_archive_namespace=strategy-node-images/$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check for reusable strategy-node image archive
        id: image-archive-cache
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive' &&
          github.event.inputs.force_rebuild != 'true'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{ steps.meta.outputs.image_archive_namespace }}
          IMAGE_ARCHIVE_KEY: ${{ steps.meta.outputs.image_archive_key }}
        run: |
          if bash scripts/ci/ci_transient_artifacts.sh exists "$IMAGE_ARCHIVE_KEY"; then
            echo "archive_exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing strategy-node image archive: $IMAGE_ARCHIVE_KEY"
          else
            echo "archive_exists=false" >> "$GITHUB_OUTPUT"
            echo "No reusable strategy-node image archive found; build required."
          fi

      - name: Build strategy-node image
        if: steps.image-archive-cache.outputs.archive_exists != 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker build --pull -t "$IMAGE_REF" -f .docker/strategy_node.dockerfile .

      - name: Push strategy-node image to GHCR
        if: >-
          ${{ steps.image-archive-cache.outputs.archive_exists != 'true' &&
          (github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport != 'archive')) }}
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker push "$IMAGE_REF"

      - name: Save strategy-node image archive
        if: >-
          steps.image-archive-cache.outputs.archive_exists != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          mkdir -p artifacts/strategy-node-image
          docker save "$IMAGE_REF" \
            | gzip -1 > artifacts/strategy-node-image/betting-arbitrage-node.tar.gz
          ls -lh artifacts/strategy-node-image/betting-arbitrage-node.tar.gz

      - name: Upload strategy-node image archive to transient CI storage
        if: >-
          steps.image-archive-cache.outputs.archive_exists != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{ steps.meta.outputs.image_archive_namespace }}
          IMAGE_ARCHIVE_KEY: ${{ steps.meta.outputs.image_archive_key }}
        run: >-
          bash scripts/ci/ci_transient_artifacts.sh put
          artifacts/strategy-node-image/betting-arbitrage-node.tar.gz
          "$IMAGE_ARCHIVE_KEY"

      - name: Post-build cleanup of stale Docker artifacts
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -f --filter "until=48h" || true
          find artifacts -type f -mtime +2 -delete 2> /dev/null || true

  deploy-strategy-node:
    name: deploy-strategy-node
    timeout-minutes: 45
    needs: [build-strategy-node-image]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_enabled == 'true'
    runs-on: [self-hosted, linux, x64, ec2, deploy, trading]
    env:
      STRATEGY_NODE_ENV_FILE: ${{ secrets.STRATEGY_NODE_ENV_FILE }}
      STRATEGY_NODE_GHCR_USERNAME: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME }}
      STRATEGY_NODE_GHCR_TOKEN: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN }}
      SXBET_API_KEY: ${{ secrets.SXBET_API_KEY }}
      SXBET_PRIVATE_KEY: ${{ secrets.SXBET_PRIVATE_KEY }}
      SXBET_WALLET_ADDRESS: ${{ secrets.SXBET_WALLET_ADDRESS }}
      CLOUDBET_API_KEY: ${{ secrets.CLOUDBET_API_KEY }}
      POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
      POLYMARKET_PK: ${{ secrets.POLYMARKET_PK }}
      POLYMARKET_FUNDER: ${{ secrets.POLYMARKET_FUNDER }}
      POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
      POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
      POLYMARKET_PASSPHRASE: ${{ secrets.POLYMARKET_PASSPHRASE }}
      STRATEGY_NODE_CONTAINER_NAME: ${{ github.event.inputs.container_name }}
      STRATEGY_NODE_IMAGE_TRANSPORT: ${{ github.event.inputs.image_transport }}
      BETTING_LIVE_EXECUTION_ARMED_INPUT: ${{ github.event.inputs.live_execution_armed }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          can_run_sudo() {
            command -v sudo > /dev/null 2>&1 && sudo -n true > /dev/null 2>&1
          }
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache" || true
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home" || true
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate deploy inputs
        run: |
          case "$STRATEGY_NODE_CONTAINER_NAME" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "Invalid STRATEGY_NODE_CONTAINER_NAME: $STRATEGY_NODE_CONTAINER_NAME" >&2
              exit 1
              ;;
          esac
          case "$STRATEGY_NODE_IMAGE_TRANSPORT" in
            archive|registry) ;;
            *)
              echo "STRATEGY_NODE_IMAGE_TRANSPORT must be archive or registry" >&2
              exit 1
              ;;
          esac
          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ] \
            && [ -z "$STRATEGY_NODE_GHCR_USERNAME" ]; then
            echo "STRATEGY_NODE_GHCR_USERNAME is required when STRATEGY_NODE_GHCR_TOKEN is set" >&2
            exit 1
          fi

      - name: Resolve deploy metadata
        id: deploy-meta
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            case "$INPUT_IMAGE_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "Invalid image tag override: $INPUT_IMAGE_TAG" >&2
                exit 1
                ;;
            esac
            tag="$INPUT_IMAGE_TAG"
          else
            tag="${GITHUB_SHA::12}"
          fi
          image_ref="ghcr.io/${REPOSITORY_OWNER}/cloudbet-market-maker/betting-arbitrage-node:${tag}"
          {
            echo "image_ref=$image_ref"
            echo "image_tag=$tag"
            echo "image_archive_key=betting-arbitrage-node.tar.gz"
            echo "image_archive_namespace=strategy-node-images/$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Download strategy-node image archive
        if: github.event.inputs.image_transport == 'archive'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{
              needs.build-strategy-node-image.outputs.image_archive_namespace ||
              steps.deploy-meta.outputs.image_archive_namespace
            }}
          IMAGE_ARCHIVE_KEY: >-
            ${{
              needs.build-strategy-node-image.outputs.image_archive_key ||
              steps.deploy-meta.outputs.image_archive_key
            }}
        run: >-
          bash scripts/ci/ci_transient_artifacts.sh get
          "$IMAGE_ARCHIVE_KEY"
          artifacts/strategy-node-image/betting-arbitrage-node.tar.gz

      - name: Prepare local deploy assets
        id: deploy-assets
        env:
          INPUT_MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          SEMANTIC_CACHE_MODE: ${{ github.event.inputs.semantic_cache_mode }}
          SEMANTIC_CACHE_DEFAULT_ROOT: ${{ github.event.inputs.semantic_cache_default_root }}
        run: |
          deploy_tmp="${RUNNER_TEMP:-/tmp}/strategy-node-release-${GITHUB_RUN_ID}"
          rm -rf "$deploy_tmp"
          install -d -m 700 "$deploy_tmp"

          manifest_path="$INPUT_MANIFEST_PATH"
          if [ -z "$manifest_path" ]; then
            manifest_path="deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json"
          fi
          case "$manifest_path" in
            deploy/strategy_nodes/*.json) ;;
            *)
              echo "Manifest path must stay under deploy/strategy_nodes and point to a JSON file" >&2
              exit 1
              ;;
          esac
          test -f "$manifest_path"
          cp "$manifest_path" "$deploy_tmp/strategy-node-manifest.json"

          # Optional deploy-time override of the semantic cache mode/registry, applied to the
          # deployed copy only: the version-controlled manifest is untouched and its declared
          # value wins when no override is passed (node default stays fresh = always re-mine).
          case "$SEMANTIC_CACHE_MODE" in
            ""|fresh|reuse|default) ;;
            *)
              echo "semantic_cache_mode must be fresh|reuse|default, got $SEMANTIC_CACHE_MODE" >&2
              exit 1
              ;;
          esac
          if [ -n "$SEMANTIC_CACHE_MODE" ] || [ -n "$SEMANTIC_CACHE_DEFAULT_ROOT" ]; then
            python3 scripts/deploy/strategy_nodes/apply_semantic_cache_override.py \
              "$deploy_tmp/strategy-node-manifest.json" \
              "$SEMANTIC_CACHE_MODE" \
              "$SEMANTIC_CACHE_DEFAULT_ROOT"
          fi
          cp \
            scripts/deploy/strategy_nodes/deploy_betting_strategy_node.sh \
            "$deploy_tmp/deploy_betting_strategy_node.sh"
          cp \
            scripts/deploy/strategy_nodes/wait_for_strategy_node_status.sh \
            "$deploy_tmp/wait_for_strategy_node_status.sh"
          cp scripts/ci/runner_health_check.sh "$deploy_tmp/runner_health_check.sh"
          chmod 700 \
            "$deploy_tmp/deploy_betting_strategy_node.sh" \
            "$deploy_tmp/wait_for_strategy_node_status.sh" \
            "$deploy_tmp/runner_health_check.sh"

          env_file="$deploy_tmp/strategy-node.env"
          install -m 600 /dev/null "$env_file"
          if [ -n "$STRATEGY_NODE_ENV_FILE" ]; then
            printf '%s\n' "$STRATEGY_NODE_ENV_FILE" >> "$env_file"
          fi
          if [ "${BETTING_LIVE_EXECUTION_ARMED_INPUT:-false}" = "true" ]; then
            printf '%s\n' "BETTING_LIVE_EXECUTION_ARMED=1" >> "$env_file"
          fi

          append_env_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$env_file"
            fi
          }

          append_env_secret SXBET_API_KEY
          append_env_secret SXBET_PRIVATE_KEY
          append_env_secret SXBET_WALLET_ADDRESS
          append_env_secret CLOUDBET_API_KEY
          append_env_secret POLYMARKET_PRIVATE_KEY
          append_env_secret POLYMARKET_PK
          append_env_secret POLYMARKET_FUNDER
          append_env_secret POLYMARKET_API_KEY
          append_env_secret POLYMARKET_API_SECRET
          append_env_secret POLYMARKET_PASSPHRASE

          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ]; then
            install -m 600 /dev/null "$deploy_tmp/strategy-node-ghcr-token"
            printf '%s' "$STRATEGY_NODE_GHCR_TOKEN" > "$deploy_tmp/strategy-node-ghcr-token"
          fi

          {
            echo "deploy_tmp=$deploy_tmp"
            echo "manifest_path=$deploy_tmp/strategy-node-manifest.json"
            echo "env_file=$env_file"
            echo "registry_token_file=$deploy_tmp/strategy-node-ghcr-token"
          } >> "$GITHUB_OUTPUT"

      - name: Load strategy-node image archive
        if: github.event.inputs.image_transport == 'archive'
        run: |
          image_archive="artifacts/strategy-node-image/betting-arbitrage-node.tar.gz"
          test -f "$image_archive"
          if ! docker load -i "$image_archive"; then
            sudo -n docker load -i "$image_archive"
          fi

      - name: Verify EC2 deploy host health
        run: |
          health_output="$(
            RUNNER_ROLE=deploy \
              ACTIONS_RUNNER_ROOT=/home/ubuntu/actions-runner \
              OPTIONAL_SERVICE_NAMES=control-plane.service,actions-runner-hygiene.timer \
              bash scripts/ci/runner_health_check.sh
          )"
          printf '%s\n' "$health_output"
          if echo "$health_output" | grep -Fq $'docker\tmissing'; then
            echo "EC2 deploy host does not report a usable docker installation" >&2
            exit 1
          fi

      - name: Deploy node on target host
        env:
          IMAGE_REF: ${{ needs.build-strategy-node-image.outputs.image_ref || steps.deploy-meta.outputs.image_ref }}
          LOCAL_DEPLOY_MANIFEST_PATH: ${{ steps.deploy-assets.outputs.manifest_path }}
          LOCAL_DEPLOY_ENV_FILE: ${{ steps.deploy-assets.outputs.env_file }}
          LOCAL_REGISTRY_TOKEN_FILE: ${{ steps.deploy-assets.outputs.registry_token_file }}
        run: |
          registry_args=()
          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ]; then
            if [ "$STRATEGY_NODE_IMAGE_TRANSPORT" = "registry" ]; then
              registry_args+=(
                --registry-user "$STRATEGY_NODE_GHCR_USERNAME"
                --registry-token-file "$LOCAL_REGISTRY_TOKEN_FILE"
              )
            fi
          fi
          scripts/deploy/strategy_nodes/deploy_betting_strategy_node.sh \
            --manifest "$LOCAL_DEPLOY_MANIFEST_PATH" \
            --image "$IMAGE_REF" \
            --name "$STRATEGY_NODE_CONTAINER_NAME" \
            --env-file "$LOCAL_DEPLOY_ENV_FILE" \
            "${registry_args[@]}"

      - name: Wait for deployed node status and semantic cache
        env:
          INPUT_MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          manifest_path="$INPUT_MANIFEST_PATH"
          if [ -z "$manifest_path" ]; then
            manifest_path="deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json"
          fi
          min_positive_margin_candidates=0
          min_cross_venue_candidates=0
          require_cross_venue_candidates_or_blockers=false
          wait_timeout_seconds=900
          quoted_node_args=()
          cloudbet_sxbet_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/cloudbet-sxbet-cross-venue-live-pilot.json"
          polymarket_sxbet_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/polymarket-sxbet-cross-venue-live-pilot.json"
          sxbet_same_venue_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/sxbet-same-venue-live-pilot.json"
          cloudbet_same_venue_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/cloudbet-same-venue-live-pilot.json"
          if [ "$manifest_path" = "deploy/strategy_nodes/betting_arbitrage/multi-venue-validation.json" ]; then
            require_cross_venue_candidates_or_blockers=true
            wait_timeout_seconds=1800
            quoted_node_args+=(--min-quoted-node-count CLOUDBET:2)
            quoted_node_args+=(--min-quoted-node-count SXBET:2)
            quoted_node_args+=(--min-quoted-node-count POLYMARKET:2)
          fi
          if [ "$manifest_path" = "$cloudbet_sxbet_live_pilot_manifest" ]; then
            require_cross_venue_candidates_or_blockers=true
            wait_timeout_seconds=2400
            quoted_node_args+=(--min-quoted-node-count CLOUDBET:2)
            quoted_node_args+=(--min-quoted-node-count SXBET:2)
          fi
          if [ "$manifest_path" = "$polymarket_sxbet_live_pilot_manifest" ]; then
            require_cross_venue_candidates_or_blockers=true
            wait_timeout_seconds=2400
            quoted_node_args+=(--min-quoted-node-count POLYMARKET:2)
            quoted_node_args+=(--min-quoted-node-count SXBET:2)
          fi
          if [ "$manifest_path" = "$sxbet_same_venue_live_pilot_manifest" ]; then
            wait_timeout_seconds=1800
            quoted_node_args+=(--min-quoted-node-count SXBET:2)
          fi
          if [ "$manifest_path" = "$cloudbet_same_venue_live_pilot_manifest" ]; then
            wait_timeout_seconds=1800
            quoted_node_args+=(--min-quoted-node-count CLOUDBET:2)
          fi
          echo "min_positive_margin_candidates=$min_positive_margin_candidates"
          echo "min_cross_venue_candidates=$min_cross_venue_candidates"
          echo "require_cross_venue_candidates_or_blockers=$require_cross_venue_candidates_or_blockers"
          echo "wait_timeout_seconds=$wait_timeout_seconds"
          cross_venue_args=()
          if [ "$require_cross_venue_candidates_or_blockers" = "true" ]; then
            cross_venue_args+=(--require-cross-venue-candidates-or-blockers)
          fi
          scripts/deploy/strategy_nodes/wait_for_strategy_node_status.sh \
            --status-file "/opt/cloudbet/strategy-nodes/$STRATEGY_NODE_CONTAINER_NAME/status.json" \
            --timeout-seconds "$wait_timeout_seconds" \
            --success-status running,completed \
            --require-semantic-cache-ready \
            --require-runtime-probe \
            --require-rust-semantic-topology \
            --min-connected-nodes 2 \
            --min-match-instruments 2 \
            --min-quoted-match-instruments 2 \
            --min-positive-margin-candidates "$min_positive_margin_candidates" \
            --min-cross-venue-candidates "$min_cross_venue_candidates" \
            "${cross_venue_args[@]}" \
            "${quoted_node_args[@]}"

      - name: Inspect deployed semantic cache directory
        run: |
          cache_dir="/opt/cloudbet/strategy-nodes/$STRATEGY_NODE_CONTAINER_NAME/semantic-rule-cache"
          test -d "$cache_dir"
          file_count="$(find "$cache_dir" -type f | wc -l | tr -d ' ')"
          printf 'semantic_cache_dir=%s\nsemantic_cache_file_count=%s\n' "$cache_dir" "$file_count"
          test "$file_count" -gt 0

      - name: Fetch deployed node status artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/strategy-node-deploy
          node_dir="/opt/cloudbet/strategy-nodes/$STRATEGY_NODE_CONTAINER_NAME"
          artifact_dir="artifacts/strategy-node-deploy"

          for name in status heartbeat manifest.runtime release current-session; do
            if [ -f "$node_dir/$name.json" ]; then
              cp "$node_dir/$name.json" "$artifact_dir/$name.json"
            fi
          done

          if [ -f "$node_dir/current-session.json" ]; then
            python3 - "$node_dir/current-session.json" "$artifact_dir" <<'PY'
          import json
          import pathlib
          import shutil
          import sys

          session_path = pathlib.Path(sys.argv[1])
          bundle_dir = pathlib.Path(sys.argv[2])
          payload = json.loads(session_path.read_text())
          for key, filename in (
              ("logPath", "node.log"),
              ("eventLogPath", "events.jsonl"),
          ):
              raw_path = payload.get(key)
              if not raw_path:
                  continue
              source = pathlib.Path(raw_path)
              if source.exists():
                  shutil.copy2(source, bundle_dir / filename)
          PY
          fi
          if [ -f "$node_dir/status.json" ]; then
            python3 - "$node_dir/status.json" "$artifact_dir/runtime-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          status_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          status = json.loads(status_path.read_text())
          runtime = status.get("runtimeProbe") or {}
          candidate_quality = runtime.get("candidateQuality") or {}
          runtime_probe_summary = dict(runtime) if isinstance(runtime, dict) else {}
          if isinstance(candidate_quality, dict):
              runtime_probe_summary["candidateQuality"] = dict(candidate_quality)
              for key in (
                  "blockerSamples",
                  "latencyHistograms",
                  "liveTimingSlo",
                  "semanticBlockedRelationships",
                  "topNegativeNearMisses",
                  "topPositiveCandidates",
                  "venueQuoteHealth",
                  "zeroCandidateBlockerCounts",
                  "zeroCandidateVenuePairSamples",
              ):
                  runtime_probe_summary["candidateQuality"][key] = candidate_quality.get(key)
          for key in (
              "coverageDiagnostics",
              "latencyDiagnostics",
              "providerQuotePollStats",
              "instrumentRefresh",
              "semanticDiagnostics",
              "venueCoverage",
          ):
              runtime_probe_summary[key] = runtime.get(key)
          summary = {
              "status": status.get("status"),
              "nodeId": status.get("nodeId"),
              "updatedAt": status.get("updatedAt"),
              "semanticCache": status.get("semanticCache"),
              "executionReadiness": status.get("executionReadiness"),
              "runtimeProbe": runtime_probe_summary,
          }
          output_path.write_text(json.dumps(summary, indent=2, sort_keys=True))
          PY
            python3 scripts/betting/runtime_probe_report.py \
              "$node_dir/status.json" \
              --format json \
              > "$artifact_dir/runtime-report.json" || true
          fi

          if [ -f artifacts/strategy-node-deploy/status.json ]; then
            echo "status_json<<EOF"
            cat artifacts/strategy-node-deploy/status.json
            echo "EOF"
          fi
          if [ -f artifacts/strategy-node-deploy/node.log ]; then
            echo "node_log_tail<<EOF"
            tail -n 120 artifacts/strategy-node-deploy/node.log
            echo "EOF"
          fi
          if [ -f artifacts/strategy-node-deploy/events.jsonl ]; then
            echo "events_tail<<EOF"
            tail -n 80 artifacts/strategy-node-deploy/events.jsonl
            echo "EOF"
          fi
          if [ -f artifacts/strategy-node-deploy/runtime-summary.json ]; then
            echo "runtime_summary_json<<EOF"
            cat artifacts/strategy-node-deploy/runtime-summary.json
            echo "EOF"
          fi

      - name: Evaluate deployed runtime report
        if: always()
        env:
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          if [ ! -f artifacts/strategy-node-deploy/status.json ]; then
            echo "No deployed status artifact available for runtime report evaluation."
            exit 0
          fi
          report_args=(
            --format text
            --require-rust-semantic
            --require-coverage-runtime
            --min-quoted-semantic-instruments 2
          )
          cloudbet_sxbet_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/cloudbet-sxbet-cross-venue-live-pilot.json"
          polymarket_sxbet_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/polymarket-sxbet-cross-venue-live-pilot.json"
          sxbet_same_venue_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/sxbet-same-venue-live-pilot.json"
          cloudbet_same_venue_live_pilot_manifest="deploy/strategy_nodes/betting_arbitrage/cloudbet-same-venue-live-pilot.json"
          live_pilot_manifest=false
          case "$MANIFEST_PATH" in
            "$cloudbet_sxbet_live_pilot_manifest"|"$polymarket_sxbet_live_pilot_manifest"|"$sxbet_same_venue_live_pilot_manifest"|"$cloudbet_same_venue_live_pilot_manifest")
              live_pilot_manifest=true
              ;;
          esac
          if [ "$live_pilot_manifest" = "true" ]; then
            report_args+=(--require-live-execution-env-unarmed)
            if [ "$MANIFEST_PATH" = "$cloudbet_sxbet_live_pilot_manifest" ]; then
              report_args+=(--require-cross-currency-live-blocked)
            fi
          else
            report_args+=(--require-auto-execute-false)
            report_args+=(--require-validation-mode)
          fi
          if [ "$MANIFEST_PATH" = "deploy/strategy_nodes/betting_arbitrage/multi-venue-validation.json" ]; then
            report_args+=(--min-cross-venue-candidates 1)
            report_args+=(--require-cross-venue-candidates-or-blockers)
          fi
          python3 scripts/betting/runtime_probe_report.py \
            artifacts/strategy-node-deploy/status.json \
            "${report_args[@]}"

      - name: Upload deployed node status artifacts to GitHub
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: strategy-node-deploy-${{ env.STRATEGY_NODE_CONTAINER_NAME }}
          path: artifacts/strategy-node-deploy
          if-no-files-found: ignore

      - name: Upload deployed node status artifacts to transient CI storage
        if: always()
        continue-on-error: true
        run: |
          if [ -d artifacts/strategy-node-deploy ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put artifacts/strategy-node-deploy \
              "diagnostics/strategy-node-deploy/$STRATEGY_NODE_CONTAINER_NAME"
          fi

      - name: Cleanup local deploy helper files
        if: always()
        env:
          LOCAL_DEPLOY_TMP: ${{ steps.deploy-assets.outputs.deploy_tmp }}
        run: |
          if [ -n "${LOCAL_DEPLOY_TMP:-}" ] && [ -d "$LOCAL_DEPLOY_TMP" ]; then
            rm -rf "$LOCAL_DEPLOY_TMP"
          fi
