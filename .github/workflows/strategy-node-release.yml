name: strategy-node-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Manifest to validate and, when enabled, deploy
        required: false
        default: deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json
      deploy_enabled:
        description: Actually deploy to the target host
        required: false
        default: 'false'
      image_tag:
        description: Optional explicit image tag override
        required: false
        default: ''
      container_name:
        description: Target strategy-node container name
        required: false
        default: betting-arbitrage-node-sxbet
      image_transport:
        description: 'How the deploy job gets the built image onto EC2: archive or registry'
        required: false
        default: archive
      force_rebuild:
        description: Rebuild the strategy-node image archive even when an R2 archive already exists
        required: false
        default: 'false'

permissions:
  contents: read

env:
  USE_GITHUB_ACTIONS_CACHE: "false"
  CI_TRANSIENT_ARTIFACTS_ENABLED: "true"
  CI_TRANSIENT_R2_BUCKET: ${{ secrets.CI_TRANSIENT_R2_BUCKET_NAME }}
  CI_TRANSIENT_R2_PREFIX: ci-transient
  CI_TRANSIENT_R2_URL: ${{ secrets.CI_TRANSIENT_R2_URL }}
  CLOUDFLARE_R2_REGION: "auto"
  CI_TRANSIENT_R2_ACCESS_KEY_ID: ${{ secrets.CI_TRANSIENT_R2_ACCESS_KEY_ID }}
  CI_TRANSIENT_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_TRANSIENT_R2_SECRET_ACCESS_KEY }}

jobs:
  validate-manifests:
    name: validate-strategy-node-manifests
    timeout-minutes: 45
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      UV_PYTHON: "3.12"
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: '3.12'
          free-disk-space: 'false'
          build-type: 'test'
          use-github-actions-cache: 'false'

      - name: Compute wheel cache key
        id: wheel-key
        run: echo "key=$(python3 scripts/ci/compute_test_wheel_cache_key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore self-hosted wheel cache
        id: local-wheel-cache
        run: bash scripts/ci/self_hosted_wheel_cache.sh restore "${{ steps.wheel-key.outputs.key }}"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --no-install-package nautilus_trader

      - name: Build wheel on cache miss
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: release
        run: |
          uv build --wheel --python 3.12
          ls -lh dist/

      - name: Install wheel
        run: uv pip install dist/*.whl

      - name: Save self-hosted wheel cache
        if: steps.local-wheel-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/self_hosted_wheel_cache.sh save "${{ steps.wheel-key.outputs.key }}"

      - name: Upload validated wheel to transient CI storage
        run: |
          wheel_path="$(find dist -maxdepth 1 -name 'nautilus_trader-*.whl' -type f | sort | tail -n 1)"
          test -n "$wheel_path"
          bash scripts/ci/ci_transient_artifacts.sh \
            put "$wheel_path" "strategy-node-wheel/$(basename "$wheel_path")"

      - name: Validate SX.bet manifest
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json"

      - name: Validate Polymarket manifest
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/polymarket-single-venue.json"

      - name: Validate Polymarket multi-venue example
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m nautilus_trader.live.strategy_nodes.betting_arbitrage \
            validate-manifest \
            --manifest "$GITHUB_WORKSPACE/deploy/strategy_nodes/betting_arbitrage/polymarket-plus-sxbet.example.json"

      - name: Upload rendered strategy-node artifacts to transient CI storage
        if: failure()
        continue-on-error: true
        run: |
          if [ -d artifacts/strategy-nodes ]; then
            bash scripts/ci/ci_transient_artifacts.sh \
              put artifacts/strategy-nodes diagnostics/strategy-nodes
          fi

  build-strategy-node-image:
    name: build-strategy-node-image
    timeout-minutes: 45
    needs: [validate-manifests]
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      STRATEGY_NODE_GHCR_USERNAME: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME }}
      STRATEGY_NODE_GHCR_TOKEN: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_archive_key: ${{ steps.meta.outputs.image_archive_key }}
      image_archive_namespace: ${{ steps.meta.outputs.image_archive_namespace }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          allowed-endpoints: |
            auth.docker.io:443
            production.cloudflare.docker.com:443
            ghcr.io:443
            index.docker.io:443
            registry-1.docker.io:443

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify GCP runner toolchain
        run: |
          python3 --version
          git --version
          docker --version

      - name: Download validated wheel
        run: bash scripts/ci/ci_transient_artifacts.sh get-prefix strategy-node-wheel dist

      - name: Log in to GHCR
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.deploy_enabled != 'true' ||
          github.event.inputs.image_transport != 'archive'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME || github.actor }}
          password: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN || github.token }}

      - name: Resolve image reference
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            case "$INPUT_IMAGE_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "Invalid image tag override: $INPUT_IMAGE_TAG" >&2
                exit 1
                ;;
            esac
            tag="$INPUT_IMAGE_TAG"
          else
            tag="${GITHUB_SHA::12}"
          fi
          image_ref="ghcr.io/${REPOSITORY_OWNER}/cloudbet-market-maker/betting-arbitrage-node:${tag}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_archive_key=betting-arbitrage-node.tar.gz" >> "$GITHUB_OUTPUT"
          echo "image_archive_namespace=strategy-node-images/$tag" >> "$GITHUB_OUTPUT"

      - name: Check for reusable strategy-node image archive
        id: image-archive-cache
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive' &&
          github.event.inputs.force_rebuild != 'true'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{ steps.meta.outputs.image_archive_namespace }}
          IMAGE_ARCHIVE_KEY: ${{ steps.meta.outputs.image_archive_key }}
        run: |
          if bash scripts/ci/ci_transient_artifacts.sh exists "$IMAGE_ARCHIVE_KEY"; then
            echo "archive_exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing strategy-node image archive: $IMAGE_ARCHIVE_KEY"
          else
            echo "archive_exists=false" >> "$GITHUB_OUTPUT"
            echo "No reusable strategy-node image archive found; build required."
          fi

      - name: Build strategy-node image
        if: steps.image-archive-cache.outputs.archive_exists != 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker build --pull -t "$IMAGE_REF" -f .docker/strategy_node.dockerfile .

      - name: Push strategy-node image to GHCR
        if: >-
          ${{ steps.image-archive-cache.outputs.archive_exists != 'true' &&
          (github.event_name != 'workflow_dispatch' ||
          github.event.inputs.deploy_enabled != 'true' ||
          github.event.inputs.image_transport != 'archive') }}
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker push "$IMAGE_REF"

      - name: Save strategy-node image archive
        if: >-
          steps.image-archive-cache.outputs.archive_exists != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          mkdir -p artifacts/strategy-node-image
          docker save "$IMAGE_REF" \
            | gzip -1 > artifacts/strategy-node-image/betting-arbitrage-node.tar.gz
          ls -lh artifacts/strategy-node-image/betting-arbitrage-node.tar.gz

      - name: Upload strategy-node image archive to transient CI storage
        if: >-
          steps.image-archive-cache.outputs.archive_exists != 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy_enabled == 'true' &&
          github.event.inputs.image_transport == 'archive'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{ steps.meta.outputs.image_archive_namespace }}
          IMAGE_ARCHIVE_KEY: ${{ steps.meta.outputs.image_archive_key }}
        run: >-
          bash scripts/ci/ci_transient_artifacts.sh put
          artifacts/strategy-node-image/betting-arbitrage-node.tar.gz
          "$IMAGE_ARCHIVE_KEY"

  deploy-strategy-node:
    name: deploy-strategy-node
    timeout-minutes: 30
    needs: [build-strategy-node-image]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_enabled == 'true'
    runs-on: [self-hosted, linux, x64, cloudbet-market-maker, ci, gcp, ubuntu24]
    env:
      STRATEGY_NODE_HOST: ${{ secrets.STRATEGY_NODE_HOST }}
      STRATEGY_NODE_SSH_USER: ${{ secrets.STRATEGY_NODE_SSH_USER }}
      STRATEGY_NODE_SSH_KEY: ${{ secrets.STRATEGY_NODE_SSH_KEY }}
      STRATEGY_NODE_ENV_FILE: ${{ secrets.STRATEGY_NODE_ENV_FILE }}
      STRATEGY_NODE_GHCR_USERNAME: ${{ secrets.STRATEGY_NODE_GHCR_USERNAME }}
      STRATEGY_NODE_GHCR_TOKEN: ${{ secrets.STRATEGY_NODE_GHCR_TOKEN }}
      STRATEGY_NODE_CONTAINER_NAME: ${{ github.event.inputs.container_name }}
      STRATEGY_NODE_IMAGE_TRANSPORT: ${{ github.event.inputs.image_transport }}
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Repair self-hosted workspace
        shell: bash
        run: |
          workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_ci_home="${RUNNER_CI_HOME:-}"
          run_maybe_sudo() {
            if [[ "${EUID}" -eq 0 ]]; then
              "$@"
              return
            fi

            if "$@"; then
              return
            fi

            local status=$?
            if command -v sudo > /dev/null 2>&1; then
              sudo -n "$@" && return
            fi

            return "$status"
          }

          if [[ -x /usr/local/bin/repair-github-runner-workspace ]]; then
            run_maybe_sudo \
              /usr/local/bin/repair-github-runner-workspace \
              "$GITHUB_WORKSPACE" \
              "$workspace_parent/.ci-cache" \
              "$(id -u)" \
              "$(id -g)"
          else
            run_maybe_sudo mkdir -p "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$workspace_parent/.ci-cache"
          fi

          if [[ -n "$runner_ci_home" ]]; then
            run_maybe_sudo mkdir -p "$runner_ci_home/.cache"
            run_maybe_sudo chown -R "$(id -u):$(id -g)" "$runner_ci_home"
          fi

          if [[ ! -e "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate deploy inputs
        run: |
          missing=()
          for name in \
            STRATEGY_NODE_HOST \
            STRATEGY_NODE_SSH_USER \
            STRATEGY_NODE_SSH_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required strategy-node deploy secret(s): %s\n' \
              "${missing[*]}" >&2
            exit 1
          fi
          case "$STRATEGY_NODE_CONTAINER_NAME" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "Invalid STRATEGY_NODE_CONTAINER_NAME: $STRATEGY_NODE_CONTAINER_NAME" >&2
              exit 1
              ;;
          esac
          case "$STRATEGY_NODE_IMAGE_TRANSPORT" in
            archive|registry) ;;
            *)
              echo "STRATEGY_NODE_IMAGE_TRANSPORT must be archive or registry" >&2
              exit 1
              ;;
          esac
          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ] \
            && [ -z "$STRATEGY_NODE_GHCR_USERNAME" ]; then
            echo "STRATEGY_NODE_GHCR_USERNAME is required when STRATEGY_NODE_GHCR_TOKEN is set" >&2
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          install -m 600 /dev/null strategy-node.key
          printf '%s' "$STRATEGY_NODE_SSH_KEY" > strategy-node.key

      - name: Resolve deploy metadata
        id: deploy-meta
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            case "$INPUT_IMAGE_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "Invalid image tag override: $INPUT_IMAGE_TAG" >&2
                exit 1
                ;;
            esac
            tag="$INPUT_IMAGE_TAG"
          else
            tag="${GITHUB_SHA::12}"
          fi
          image_ref="ghcr.io/${REPOSITORY_OWNER}/cloudbet-market-maker/betting-arbitrage-node:${tag}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_archive_key=betting-arbitrage-node.tar.gz" >> "$GITHUB_OUTPUT"
          echo "image_archive_namespace=strategy-node-images/$tag" >> "$GITHUB_OUTPUT"

      - name: Download strategy-node image archive
        if: github.event.inputs.image_transport == 'archive'
        env:
          CI_TRANSIENT_RUN_PREFIX: >-
            ${{ github.repository }}/${{
              needs.build-strategy-node-image.outputs.image_archive_namespace ||
              steps.deploy-meta.outputs.image_archive_namespace
            }}
          IMAGE_ARCHIVE_KEY: >-
            ${{
              needs.build-strategy-node-image.outputs.image_archive_key ||
              steps.deploy-meta.outputs.image_archive_key
            }}
        run: >-
          bash scripts/ci/ci_transient_artifacts.sh get
          "$IMAGE_ARCHIVE_KEY"
          artifacts/strategy-node-image/betting-arbitrage-node.tar.gz

      - name: Upload manifest and deploy script
        env:
          INPUT_MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          manifest_path="$INPUT_MANIFEST_PATH"
          if [ -z "$manifest_path" ]; then
            manifest_path="deploy/strategy_nodes/betting_arbitrage/sxbet-single-venue.json"
          fi
          case "$manifest_path" in
            deploy/strategy_nodes/*.json) ;;
            *)
              echo "Manifest path must stay under deploy/strategy_nodes and point to a JSON file" >&2
              exit 1
              ;;
          esac
          test -f "$manifest_path"
          scp -i strategy-node.key -o StrictHostKeyChecking=no \
            "$manifest_path" \
            "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST:/tmp/strategy-node-manifest.json"
          scp -i strategy-node.key -o StrictHostKeyChecking=no \
            scripts/deploy/strategy_nodes/deploy_betting_strategy_node.sh \
            "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST:/tmp/deploy_betting_strategy_node.sh"
          scp -i strategy-node.key -o StrictHostKeyChecking=no \
            scripts/ci/runner_health_check.sh \
            "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST:/tmp/runner_health_check.sh"
          if [ -n "$STRATEGY_NODE_ENV_FILE" ]; then
            printf '%s' "$STRATEGY_NODE_ENV_FILE" | \
              ssh -i strategy-node.key -o StrictHostKeyChecking=no \
                "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
                'cat > /tmp/strategy-node.env'
          fi
          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ]; then
            printf '%s' "$STRATEGY_NODE_GHCR_TOKEN" | \
              ssh -i strategy-node.key -o StrictHostKeyChecking=no \
                "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
                'cat > /tmp/strategy-node-ghcr-token'
            ssh -i strategy-node.key -o StrictHostKeyChecking=no \
              "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
              'chmod 600 /tmp/strategy-node-ghcr-token'
          fi

      - name: Upload and load strategy-node image archive
        if: github.event.inputs.image_transport == 'archive'
        run: |
          image_archive="artifacts/strategy-node-image/betting-arbitrage-node.tar.gz"
          test -f "$image_archive"
          scp -i strategy-node.key -o StrictHostKeyChecking=no \
            "$image_archive" \
            "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST:/tmp/strategy-node-image.tar.gz"
          ssh -i strategy-node.key -o StrictHostKeyChecking=no \
            "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
            "sudo docker load -i /tmp/strategy-node-image.tar.gz"

      - name: Verify EC2 deploy host health
        run: |
          runner_service_name="actions.runner.antonga23-cloudbet-market-maker."
          runner_service_name+="ip-172-31-21-124-cloudbet-market-maker.service"
          health_output="$(
            ssh -i strategy-node.key -o StrictHostKeyChecking=no "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
              "chmod +x /tmp/runner_health_check.sh && \
               RUNNER_ROLE=deploy \
               ACTIONS_RUNNER_ROOT=/home/ubuntu/actions-runner \
               GITHUB_RUNNER_SERVICE_NAME=$runner_service_name \
               OPTIONAL_SERVICE_NAMES=control-plane.service,actions-runner-hygiene.timer \
               bash /tmp/runner_health_check.sh"
          )"
          printf '%s\n' "$health_output"
          expected_runner_state="${runner_service_name}"$'\tactive'
          if echo "$health_output" | grep -Fq $'docker\tmissing'; then
            echo "EC2 deploy host does not report a usable docker installation" >&2
            exit 1
          fi
          if ! echo "$health_output" | grep -Fq \
            "$expected_runner_state"; then
            echo "EC2 deploy runner service is not active" >&2
            exit 1
          fi

      - name: Deploy node on target host
        env:
          IMAGE_REF: ${{ needs.build-strategy-node-image.outputs.image_ref || steps.deploy-meta.outputs.image_ref }}
        run: |
          if [ -n "$STRATEGY_NODE_GHCR_TOKEN" ]; then
            if [ "$STRATEGY_NODE_IMAGE_TRANSPORT" = "registry" ]; then
              registry_args="--registry-user $STRATEGY_NODE_GHCR_USERNAME "
              registry_args+="--registry-token-file /tmp/strategy-node-ghcr-token"
            else
              registry_args=""
            fi
          else
            registry_args=""
          fi
          ssh -i strategy-node.key -o StrictHostKeyChecking=no "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
            "chmod +x /tmp/deploy_betting_strategy_node.sh && \
             /tmp/deploy_betting_strategy_node.sh \
               --manifest /tmp/strategy-node-manifest.json \
               --image '$IMAGE_REF' \
               --name '$STRATEGY_NODE_CONTAINER_NAME' \
               ${STRATEGY_NODE_ENV_FILE:+--env-file /tmp/strategy-node.env} \
               $registry_args && \
             rm -f /tmp/strategy-node-ghcr-token"

      - name: Cleanup remote helper files
        if: always()
        run: |
          if [ ! -s strategy-node.key ] \
            || [ -z "$STRATEGY_NODE_SSH_USER" ] \
            || [ -z "$STRATEGY_NODE_HOST" ]; then
            echo "Skipping remote cleanup because SSH deploy inputs were not prepared."
            exit 0
          fi
          ssh -i strategy-node.key -o StrictHostKeyChecking=no "$STRATEGY_NODE_SSH_USER@$STRATEGY_NODE_HOST" \
            'rm -f /tmp/deploy_betting_strategy_node.sh \
              /tmp/runner_health_check.sh \
              /tmp/strategy-node-ghcr-token \
              /tmp/strategy-node-image.tar.gz'
