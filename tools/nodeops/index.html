<title>Nodeops — strategy node dashboard</title>
<style>
  :root{
    --ground:#0E1512; --panel:#16201C; --panel2:#1E2B26; --line:#2C3A34; --line2:#3A4C44;
    --ink:#C9D3CE; --muted:#8A968F; --faint:#5E6B63;
    --gold:#E8C26B;
    --pos:#46B17E; --neg:#CF5C45; --warn:#E0913C; --info:#5FA8C2;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--info)}
  header{padding:20px clamp(16px,3vw,36px);border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em}
  header .meta{color:var(--muted);font-size:12px;font-family:var(--mono)}
  header .spacer{flex:1}
  .ro-badge{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);
    color:var(--warn);text-transform:uppercase;letter-spacing:.08em}
  .link-btn{font:inherit;font-size:12px;padding:4px 10px;border-radius:5px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer}
  .link-btn:hover{border-color:var(--gold);color:var(--gold)}
  main{padding:clamp(12px,3vw,28px)}
  .wrap{max-width:1560px;margin:0 auto}
  /* filter bar */
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .filters .fgroup{display:flex;flex-direction:column;gap:3px}
  .filters label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .filters select,.filters input{font:inherit;font-size:12px;padding:5px 8px;border-radius:5px;
    border:1px solid var(--line2);background:var(--ground);color:var(--ink);min-width:130px}
  .filters .reset{align-self:flex-end}
  table{border-collapse:collapse;width:100%;font-size:13px}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;background:var(--panel);position:sticky;top:0;z-index:1}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  th .arrow{color:var(--gold);font-size:9px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--panel)}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  .chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;
    font-family:var(--mono);border:1px solid var(--line2)}
  .chip.running{color:var(--pos);border-color:var(--pos)}
  .chip.exited,.chip.dead{color:var(--neg);border-color:var(--neg)}
  .chip.restarting,.chip.paused,.chip.created{color:var(--warn);border-color:var(--warn)}
  .chip.unknown{color:var(--muted)}
  .badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;
    font-family:var(--mono);border:1px solid var(--line2);letter-spacing:.02em}
  .badge.pos{color:var(--pos);border-color:var(--pos)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .badge.neg{color:var(--neg);border-color:var(--neg)}
  .badge.muted{color:var(--muted)}
  .rag{font-family:var(--mono);font-size:12px}
  .rag .g{color:var(--pos)} .rag .a{color:var(--warn)} .rag .r{color:var(--neg)}
  .mini-bar{display:inline-block;vertical-align:middle}
  .stale{color:var(--neg)}
  .muted{color:var(--muted)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
  /* drawer */
  #scrim{position:fixed;inset:0;background:#0007;display:none;z-index:5}
  #scrim.open{display:block}
  #drawer{position:fixed;top:0;right:0;height:100vh;width:min(920px,97vw);z-index:6;
    background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);
    transition:transform .18s ease;overflow-y:auto;padding:22px clamp(16px,2.5vw,28px)}
  #drawer.open{transform:translateX(0)}
  /* ops panel (alerts / audit) — same slide-in shell as the drawer */
  #opsScrim{position:fixed;inset:0;background:#0007;display:none;z-index:7}
  #opsScrim.open{display:block}
  #opsPanel{position:fixed;top:0;right:0;height:100vh;width:min(760px,97vw);z-index:8;
    background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);
    transition:transform .18s ease;overflow-y:auto;padding:22px clamp(16px,2.5vw,28px)}
  #opsPanel.open{transform:translateX(0)}
  #opsPanel h2{margin:0 0 4px;font-size:16px;font-weight:600}
  .alert-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12px}
  .alert-row .sev{flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;width:64px}
  .alert-row .sev.high{color:var(--neg)} .alert-row .sev.warning{color:var(--warn)}
  .alert-row .sev.info{color:var(--info)}
  .alert-row .ats{color:var(--faint);flex-shrink:0}
  .alert-row .anode{color:var(--gold);flex-shrink:0}
  .alert-row .adet{color:var(--ink)}
  .hookbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;
    font-family:var(--mono);font-size:12px;color:var(--muted)}
  .hookbar code{color:var(--ink)}
  #drawer h2{margin:0 0 4px;font-size:16px;font-weight:600}
  #drawer .sub{color:var(--muted);font-family:var(--mono);font-size:12px;margin-bottom:14px}
  .close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);
    font-size:22px;cursor:pointer;line-height:1;z-index:2}
  /* tabs */
  .tabstrip{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);
    margin-bottom:16px;position:sticky;top:-22px;background:var(--panel);padding-top:4px;z-index:2}
  .tabstrip button{font:inherit;font-size:12px;padding:6px 11px;border:none;
    border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}
  .tabstrip button:hover{color:var(--ink)}
  .tabstrip button.active{color:var(--gold);border-bottom-color:var(--gold)}
  .tabpane{display:none}
  .tabpane.active{display:block}
  .section{margin:0 0 18px}
  .section h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:500}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;font-size:12.5px;
    font-family:var(--mono)}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-word}
  .charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .chart{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--ground)}
  .chart .label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .chart .val{font-family:var(--mono);color:var(--ink)}
  .chart svg{display:block;width:100%;height:46px;margin-top:4px}
  .chart.rag svg{height:96px}
  .windows{display:inline-flex;gap:6px;margin-left:8px}
  .windows button,.actions button{font:inherit;font-size:12px;padding:3px 10px;border-radius:5px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer}
  .windows button.active{border-color:var(--gold);color:var(--gold)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions button:hover:not(:disabled){border-color:var(--gold)}
  .actions button.danger{color:var(--neg);border-color:var(--neg)}
  button:disabled{opacity:.4;cursor:not-allowed}
  pre.manifest{background:var(--ground);border:1px solid var(--line);border-radius:6px;
    padding:12px;overflow:auto;max-height:420px;font-family:var(--mono);font-size:12px;color:var(--ink)}
  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:12px}
  .funnel .stage{display:flex;align-items:center;gap:8px}
  .funnel .stage .fname{width:150px;color:var(--muted);text-align:right;flex-shrink:0}
  .funnel .stage .fbar{height:16px;background:var(--info);border-radius:3px;min-width:2px}
  .funnel .stage .fval{color:var(--ink)}
  /* horizontal count-bar list */
  .barlist{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:12px}
  .barlist .row{display:flex;align-items:center;gap:8px}
  .barlist .blabel{width:150px;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex-shrink:0}
  .barlist .bbar{height:14px;border-radius:3px;min-width:2px;background:var(--gold)}
  .barlist .bval{color:var(--ink)}
  /* matrices */
  .mtx{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin-bottom:6px}
  .mtx th,.mtx td{border:1px solid var(--line);padding:4px 8px;text-align:right}
  .mtx th{background:var(--panel2);color:var(--muted);text-align:center}
  .mtx td.rowhdr{background:var(--panel2);color:var(--muted);text-align:left}
  /* candidate/data tables inside drawer */
  table.data{border:1px solid var(--line);border-radius:6px;font-size:12px}
  table.data th{position:static;background:var(--panel2)}
  table.data td,table.data th{border-bottom:1px solid var(--line);padding:6px 9px}
  .subtle{color:var(--faint);font-size:11px;margin:2px 0 8px}
  #job{margin-top:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;
    background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:0}
  #job:not(:empty){padding:10px}
  /* market-window form (Overview) */
  .mw-form{margin-top:10px}
  .mw-form .mw-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .mw-form .fgroup{display:flex;flex-direction:column;gap:3px}
  .mw-form label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .mw-form input,.mw-form select{font:inherit;font-size:12px;padding:5px 8px;border-radius:5px;
    border:1px solid var(--line2);background:var(--ground);color:var(--ink);min-width:110px}
  .mw-form .windows{margin-left:0;align-self:flex-end;padding-bottom:1px}
  .mw-form #mwApply{font:inherit;font-size:12px;padding:5px 12px;border-radius:5px;
    border:1px solid var(--gold);background:var(--panel2);color:var(--gold);cursor:pointer}
  .mw-form #mwApply:hover:not(:disabled){background:var(--panel)}
  #mwResult{margin-top:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;
    background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:0}
  #mwResult:not(:empty){padding:10px}
  /* pending-trade approval cards */
  .approval{margin-top:10px;padding:10px 12px;border:1px solid var(--line2);
    border-radius:6px;background:var(--ground)}
  .approval-head{margin-bottom:6px}
  .approval .leg{font-size:12px;margin:3px 0;font-family:var(--mono)}
  #apResult{margin-top:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;
    background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:0}
  #apResult:not(:empty){padding:10px}
  .del-confirm{display:none;margin-top:12px;padding:12px;border:1px solid var(--neg);
    border-radius:6px;background:var(--ground);max-width:420px}
  .del-confirm.open{display:block}
  .del-confirm label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}
  .del-confirm input{font:inherit;font-family:var(--mono);font-size:12px;padding:6px 9px;width:100%;
    border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);margin-bottom:8px}
  .hidden{display:none}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  /* modal (change-password) */
  #modalScrim{position:fixed;inset:0;background:#000a;display:none;z-index:20;
    align-items:center;justify-content:center}
  #modalScrim.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;
    padding:24px;width:min(420px,94vw);box-shadow:0 20px 60px #000a}
  .modal h2{margin:0 0 4px;font-size:16px}
  .modal p.hint{color:var(--muted);font-size:12px;margin:0 0 16px}
  .modal .field{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
  .modal label{font-size:11px;color:var(--muted)}
  .modal input{font:inherit;font-size:13px;padding:8px 10px;border-radius:6px;
    border:1px solid var(--line2);background:var(--ground);color:var(--ink)}
  .modal .msg{font-size:12px;min-height:16px;margin-bottom:10px}
  .modal .msg.err{color:var(--neg)}
  .modal .msg.ok{color:var(--pos)}
  .modal .actions{justify-content:flex-end}
  .modal button.primary{border-color:var(--gold);color:var(--gold)}
</style>

<header>
  <h1>Nodeops</h1>
  <span class="meta" id="summary">loading…</span>
  <span class="ro-badge hidden" id="roBadge">read-only</span>
  <span class="spacer"></span>
  <button class="link-btn" id="alertsBtn" type="button">Alerts</button>
  <button class="link-btn" id="auditBtn" type="button">Audit</button>
  <span class="meta" id="whoami"></span>
  <button class="link-btn" id="changePwBtn" type="button">Change password</button>
</header>
<main><div class="wrap">
  <div class="filters" id="filters">
    <div class="fgroup">
      <label for="fRag">RAG</label>
      <select id="fRag">
        <option value="all">all</option>
        <option value="green">green &gt; 0</option>
        <option value="amber">amber-dominant</option>
        <option value="red">red-dominant</option>
        <option value="none">none</option>
      </select>
    </div>
    <div class="fgroup">
      <label for="fQuote">Quote health</label>
      <select id="fQuote">
        <option value="all">all</option>
        <option value="quoting">quoting</option>
        <option value="no-quotes">no quotes</option>
      </select>
    </div>
    <div class="fgroup">
      <label for="fFamily">Node family</label>
      <select id="fFamily"><option value="all">all</option></select>
    </div>
    <div class="fgroup">
      <label for="fVenue">Venue / name contains</label>
      <input id="fVenue" type="text" placeholder="e.g. sxbet" autocomplete="off">
    </div>
    <div class="fgroup reset">
      <button class="link-btn" id="fReset" type="button">Reset filters</button>
    </div>
  </div>
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Node</th><th>State</th><th class="num">HB age</th><th class="num">Uptime</th>
        <th>Image</th>
        <th>Quote health</th>
        <th class="num">Instr</th><th class="num">Edges</th><th class="num">Quoted</th>
        <th class="num">xVenue</th><th>RAG</th><th>Margin</th>
        <th class="num">Raw</th><th class="num">Valid</th><th class="num">Exec</th>
        <th class="num">Done</th><th class="num">Uniq/Dup</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="17" class="empty">loading…</td></tr></tbody>
    </table>
  </div>
</div></main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>

<div id="opsScrim"></div>
<aside id="opsPanel" aria-hidden="true"></aside>

<div id="modalScrim">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">Change password</h2>
    <p class="hint" id="modalHint"></p>
    <form id="pwForm">
      <div class="field">
        <label for="pwCurrent">Current password</label>
        <input id="pwCurrent" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="pwUser">New username (optional)</label>
        <input id="pwUser" type="text" autocomplete="username" placeholder="unchanged if blank">
      </div>
      <div class="field">
        <label for="pwNew">New password (min 8)</label>
        <input id="pwNew" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="pwConfirm">Confirm new password</label>
        <input id="pwConfirm" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="msg" id="pwMsg"></div>
      <div class="actions">
        <button type="button" class="link-btn" id="pwCancel">Cancel</button>
        <button type="submit" class="link-btn primary">Change password</button>
      </div>
    </form>
  </div>
</div>

<script>
"use strict";
const REFRESH_MS = 15000;
const state = {
  readonly: true,
  current: null,
  window: 6,
  timer: null,
  nodes: [],
  authIsDefault: false,
  authUsername: null,
  authDisabled: false,
  filters: { rag: "all", quote: "all", venue: "", family: "all" },
  tab: "overview",
  edges: null,       // /odds response cache for the open node
  detail: null,      // /api/nodes/<name> cache for the open node
  sort: { positive: null, negative: null, value: null },
  ops: null,         // "alerts" | "audit" — open ops panel, or null
};

// ---- fetch wrapper ---------------------------------------------------------
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin" }, opts || {}));
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).error || detail; } catch (e) { /* ignore */ }
    const err = new Error(detail + " (" + res.status + ")");
    err.status = res.status;
    throw err;
  }
  return res.json();
}

// ---- primitives ------------------------------------------------------------
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function shortImage(image) {
  if (!image) return "—";
  const tail = String(image).split("/").pop();
  const at = tail.indexOf("@sha256:");
  if (at >= 0) return tail.slice(0, at) + "@" + tail.slice(at + 8, at + 15);
  return tail.length > 22 ? tail.slice(0, 21) + "…" : tail;
}
function fmtAge(secs) {
  if (secs == null) return { text: "—", stale: false };
  const s = Math.round(secs);
  const text = s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h";
  return { text, stale: s > 180 };
}
function num(v) { return v == null ? "—" : v; }
// humanized container uptime: 32s / 45m / 18h 32m / 3d 4h
function fmtUptime(secs) {
  const n = toNum(secs);
  if (Number.isNaN(n) || n < 0) return "—";
  const s = Math.floor(n);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (h < 1) return m + "m";
  if (d < 1) return h + "h " + (m % 60) + "m";
  return d + "d " + (h % 24) + "h";
}
// tolerate string-or-number probe values (spec 0.4)
function toNum(v) {
  if (v == null || v === "") return NaN;
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isNaN(n) ? NaN : n;
}
function fmtNum(v, dp) {
  const n = toNum(v);
  if (Number.isNaN(n)) return v == null || v === "" ? "—" : esc(String(v));
  return dp == null ? String(n) : n.toFixed(dp);
}
function stateChip(st) {
  const key = (st || "unknown").toLowerCase();
  return '<span class="chip ' + esc(key) + '">' + esc(st || "unknown") + "</span>";
}

// ---- RAG cell + margin mini-bar (hand-rolled inline SVG, CSP-safe) ---------
function ragCell(s) {
  if (!s) return '<span class="muted">—</span>';
  return '<span class="rag"><span class="g">' + num(s.rag_green) + '</span>/' +
    '<span class="a">' + num(s.rag_amber) + '</span>/' +
    '<span class="r">' + num(s.rag_red) + "</span></span>";
}
function marginMini(s, width) {
  const W = width || 64, H = 12;
  const g = Math.max(0, toNum(s && s.rag_green) || 0);
  const a = Math.max(0, toNum(s && s.rag_amber) || 0);
  const r = Math.max(0, toNum(s && s.rag_red) || 0);
  const total = g + a + r;
  if (!total) return '<svg class="mini-bar" width="' + W + '" height="' + H + '" ' +
    'viewBox="0 0 ' + W + ' ' + H + '"><rect x="0" y="0" width="' + W + '" height="' + H +
    '" rx="2" fill="var(--line)"/></svg>';
  const gw = (g / total) * W, aw = (a / total) * W, rw = (r / total) * W;
  const seg = (x, w, fill) =>
    w <= 0 ? "" : '<rect x="' + x.toFixed(2) + '" y="0" width="' + w.toFixed(2) +
      '" height="' + H + '" fill="' + fill + '"/>';
  return '<svg class="mini-bar" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W +
    ' ' + H + '"><g>' + seg(0, gw, "var(--pos)") + seg(gw, aw, "var(--warn)") +
    seg(gw + aw, rw, "var(--neg)") + '</g></svg>';
}

// ---- quote-health badge (client-side, spec D.2) ----------------------------
function quoteBadge(s) {
  const q = s ? s.quoted_edges : null;
  if (q == null) {
    return '<span class="badge muted" title="no sample">—</span>';
  }
  if (q > 0) {
    return '<span class="badge pos" title="' + esc(q + " quoted edges") + '">quoting</span>';
  }
  if (s.graph_edges > 0) {
    return '<span class="badge warn" title="edges exist but 0 quoted — check providerQuotePollStats">no quotes</span>';
  }
  return '<span class="badge neg" title="no graph edges built yet">no edges</span>';
}
// uniq/dup proxy (spec D.1 col 16): valid = unique, raw-valid = duplicate/suppressed
function uniqDup(s) {
  if (!s) return "—";
  const valid = s.valid_opportunities;
  const raw = s.raw_detections;
  if (valid == null && raw == null) return "—";
  const u = valid == null ? "—" : valid;
  const d = (raw == null || valid == null) ? "—" : Math.max(0, raw - valid);
  return u + "/" + d;
}

// ---- node family + filters -------------------------------------------------
function familyOf(node) {
  const m = String(node).split(/[-_]/)[0];
  return m || node;
}
function nodeMatchesFilters(n) {
  const s = n.latest || {};
  const f = state.filters;
  const g = s.rag_green || 0, a = s.rag_amber || 0, r = s.rag_red || 0;
  if (f.rag === "green" && !(g > 0)) return false;
  if (f.rag === "amber" && !(a >= g && a >= r && a > 0)) return false;
  if (f.rag === "red" && !(r >= g && r >= a && r > 0)) return false;
  if (f.rag === "none" && (g + a + r) !== 0) return false;
  if (f.quote === "quoting" && !(s.quoted_edges > 0)) return false;
  if (f.quote === "no-quotes" && !(s.quoted_edges === 0 || s.quoted_edges == null)) return false;
  if (f.family !== "all" && familyOf(n.node) !== f.family) return false;
  if (f.venue && !String(n.node).toLowerCase().includes(f.venue.toLowerCase())) return false;
  return true;
}

// ---- sparkline (existing, unchanged) ---------------------------------------
function sparkline(points, key) {
  const W = 200, H = 46, pad = 3;
  const vals = points.map(p => p[key]).filter(v => v != null);
  if (vals.length < 2) return '<svg viewBox="0 0 ' + W + " " + H + '"></svg>';
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const n = points.length;
  const coords = points.map((p, i) => {
    const v = p[key] == null ? min : p[key];
    const x = pad + (i / (n - 1)) * (W - 2 * pad);
    const y = H - pad - ((v - min) / span) * (H - 2 * pad);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const lastPt = coords.split(" ").pop().split(",");
  return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
    '<polyline fill="none" stroke="var(--info)" stroke-width="1.5" points="' + coords + '"/>' +
    '<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="2" fill="var(--gold)"/>' +
    "</svg>";
}

];
const RAG_METRICS = ["rag_green", "rag_amber", "rag_red"];

// stacked-area RAG history (hand-rolled inline SVG, CSP-safe; colors match ragCell)
function ragStackChart(points) {
  const W = 640, H = 96, pad = 3;
  const series = points.map(p => {
    const g = Math.max(0, toNum(p.rag_green) || 0);
    const a = Math.max(0, toNum(p.rag_amber) || 0);
    const r = Math.max(0, toNum(p.rag_red) || 0);
    return { g, a, r, total: g + a + r };
  });
  const max = Math.max(...series.map(s => s.total));
  if (!max) return '<div class="muted">no candidate bands in window</div>';
  const pts = series.length < 2 ? [series[0], series[0]] : series;
  const n = pts.length;
  const x = i => pad + (i / (n - 1)) * (W - 2 * pad);
  const y = v => H - pad - (v / max) * (H - 2 * pad);
  const band = (lower, upper, fill) => {
    const top = pts.map((s, i) => x(i).toFixed(1) + "," + y(upper(s)).toFixed(1));
    const bottom = pts.map((s, i) => x(i).toFixed(1) + "," + y(lower(s)).toFixed(1)).reverse();
    return '<polygon fill="' + fill + '" fill-opacity="0.75" points="' +
      top.concat(bottom).join(" ") + '"/>';
  };
  return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
    band(() => 0, s => s.g, "var(--pos)") +
    band(s => s.g, s => s.g + s.a, "var(--warn)") +
    band(s => s.g + s.a, s => s.g + s.a + s.r, "var(--neg)") +
    "</svg>";
}

// ---- generic renderers -----------------------------------------------------
// Recursive key/value block for arbitrary probe sub-objects (spec D.3 rule).
function renderKV(obj) {
  if (obj == null) return '<div class="muted">no data</div>';
  if (typeof obj !== "object") return '<div class="kv"><span class="v">' + esc(String(obj)) + "</span></div>";
  const entries = Array.isArray(obj)
    ? obj.map((v, i) => [String(i), v])
    : Object.entries(obj);
  if (!entries.length) return '<div class="muted">no data</div>';
  const rows = entries.map(([k, v]) => {
    let vs;
    if (v != null && typeof v === "object") {
      vs = "<pre class=\"manifest\">" + esc(JSON.stringify(v, null, 2)) + "</pre>";
    } else {
      vs = esc(v == null ? "—" : String(v));
    }
    return '<span class="k">' + esc(k) + '</span><span class="v">' + vs + "</span>";
  }).join("");
  return '<div class="kv">' + rows + "</div>";
}
function renderJSON(obj, emptyMsg) {
  if (obj == null || (typeof obj === "object" && !Object.keys(obj).length))
    return '<div class="muted">' + esc(emptyMsg || "no data") + "</div>";
  return '<pre class="manifest">' + esc(JSON.stringify(obj, null, 2)) + "</pre>";
}
// sorted {label:count} bar list
function renderBarList(map, emptyMsg) {
  if (!map || typeof map !== "object" || !Object.keys(map).length)
    return '<div class="muted">' + esc(emptyMsg || "no data") + "</div>";
  const entries = Object.entries(map)
    .map(([k, v]) => [k, toNum(v)])
    .filter(([, v]) => !Number.isNaN(v))
    .sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<div class="muted">' + esc(emptyMsg || "no data") + "</div>";
  const max = Math.max(...entries.map(e => e[1]), 1);
  const rows = entries.map(([k, v]) => {
    const w = Math.max(2, (v / max) * 220);
    return '<div class="row"><span class="blabel" title="' + esc(k) + '">' + esc(k) + "</span>" +
      '<span class="bbar" style="width:' + w.toFixed(1) + 'px"></span>' +
      '<span class="bval">' + esc(String(v)) + "</span></div>";
  }).join("");
  return '<div class="barlist">' + rows + "</div>";
}

  const mwField = k => strat[k] != null ? strat[k] : man[k];

  }));

    out.push('<div class="subtle">probe resolutionHorizon diagnostics</div>');
    out.push(renderKV(probe.resolutionHorizon));
  }
  if (!d.manifest) {
    out.push('<div class="muted">no manifest.runtime.json — window not editable</div></div>');
    return out.join("");
  }

    '<select id="mwTiming" ' + disabled + ">" + ["all", "pre_market"].map(v =>
      '<option value="' + v + '"' + (v === timing ? " selected" : "") + ">" + v + "</option>").join("") +
    "</select></div>");

function wireMarketWindow(node, d) {
  const apply = document.getElementById("mwApply");
  if (!apply) return;
  const hours = document.getElementById("mwHours");
  const timing = document.getElementById("mwTiming");
  const result = document.getElementById("mwResult");
  for (const b of document.querySelectorAll("button[data-mwh]")) {
    b.addEventListener("click", () => { hours.value = b.dataset.mwh; });
  }
  apply.addEventListener("click", async () => {
    if (d.readonly) return;
    const h = parseFloat(hours.value);
    if (!(h > 0) || h > 720) { result.textContent = "horizon hours must be in (0, 720]"; return; }
    if (!confirm("Extend market window of " + node + " to " + h + "h (timing filter: " +
        timing.value + ")?\n\nThis rewrites the node manifest and restarts the node.")) return;
    result.textContent = "applying…";
    try {
      const r = await api("/api/nodes/" + encodeURIComponent(node) + "/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          max_resolution_horizon_hours: h,
          market_timing_filter: timing.value,
          restart: true,
        }),
      });
      const parts = Object.entries(r.changed || {}).map(([k, v]) =>
        k + ": " + (v.old == null ? "—" : v.old) + " → " + v.new);
      result.textContent = "ok — " + parts.join("\n") +
        "\nbackup: " + r.backup +
        (r.restarted ? "\nnode restarted" : "\nnode NOT restarted");
      setTimeout(loadNodes, 1500);
      setTimeout(() => { if (state.current === node) renderDrawer(node); }, 4000);
    } catch (e) {
      result.textContent = "failed: " + e.message;
    }
  });
}

// arb funnel from strategyStats (spec D.3 Tab1)
function arbFunnel(probe) {
  const st = probe.strategyStats || {};
  const stages = [
    ["raw_arbitrage_detections", "raw detections"],
    ["opportunities_found", "opportunities found"],
    ["executable_candidates", "executable candidates"],
    ["opportunities_executed", "opportunities executed"],
  ];
  const known = new Set(stages.map(x => x[0]));
  const vals = stages.map(([k]) => toNum(st[k]) || 0);
  const top = Math.max(...vals, 1);
  const present = stages.some(([k]) => st[k] != null);
  if (!present) return '<div class="muted">no strategyStats</div>';
  const bars = stages.map(([k, label], i) => {
    const v = st[k];
    const w = Math.max(2, ((toNum(v) || 0) / top) * 320);
    return '<div class="stage"><span class="fname">' + esc(label) + "</span>" +
      '<span class="fbar" style="width:' + w.toFixed(1) + 'px"></span>' +
      '<span class="fval">' + (v == null ? "—" : esc(String(v))) + "</span></div>";
  }).join("");
  // suppression / other counters below the funnel
  const extras = Object.entries(st).filter(([k]) => !known.has(k));
  let extraHtml = "";
  if (extras.length) {
    extraHtml = '<h3 style="margin-top:14px">Suppression / other counters</h3>' +
      '<div class="kv">' + extras.map(([k, v]) =>
        '<span class="k">' + esc(k) + '</span><span class="v">' + esc(String(v)) + "</span>").join("") +
      "</div>";
  }
  return '<div class="funnel">' + bars + "</div>" + extraHtml;
}

// ---- Tab: Pending trades (manual execution approvals) -----------------------
// Renders executionApprovals from the node's runtime probe. Approve/Reject POST
// /api/nodes/<name>/approvals/<id>/(approve|reject); the server drops a command
// file into the node dir, the strategy applies it on its next poll after
// re-running every live execution gate, and the ack lands in recent decisions on
// a later probe. Pending records live in strategy memory only, so a node restart
// clears the queue.
function fmtCountdown(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  if (!isFinite(t)) return "—";
  const secs = Math.round((t - Date.now()) / 1000);
  if (secs <= 0) return "expired";
  return secs < 90 ? secs + "s" : Math.round(secs / 60) + "m";
}

function fmtSince(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  if (!isFinite(t)) return "—";
  return fmtAge(Math.max(0, (Date.now() - t) / 1000)).text;
}

function pctOf(v) {
  const n = toNum(v);
  return n == null ? "—" : (n * 100).toFixed(2) + "%";
}

      '<button class="danger" data-reject="' + esc(p.approval_id) + '" ' + (ro ? "disabled" : "") + ">Reject…</button>" +

      "</tbody></table>");

  out.push("</div></div>");
  return out.join("");
}

function wireApprovals(node, ro) {
  const result = document.getElementById("apResult");
  const refresh = document.getElementById("apRefresh");
  if (refresh) refresh.addEventListener("click", () => renderDrawer(node));
  const act = async (id, action, message) => {
    if (ro) return;
    if (!confirm(message)) return;
    if (result) result.textContent = action + " " + id + "…";
    try {
      const r = await api("/api/nodes/" + encodeURIComponent(node) + "/approvals/" +
        encodeURIComponent(id) + "/" + action, { method: "POST" });
      if (result) {
        result.textContent = action + " queued (command " + r.command_id +
          ") — node applies on next poll; decision lands under Recent decisions";
      }
      setTimeout(() => { if (state.current === node && state.tab === "approvals") renderDrawer(node); }, 4000);
    } catch (e) {
      if (result) result.textContent = action + " failed: " + e.message;
    }
  };
  const rowSummary = id => {
    const ap = (state.detail || {}).executionApprovals || {};
    const p = (ap.pending || []).find(x => x.approval_id === id) || {};
    return (p.venue_a || "?") + " " + (p.odds_a || "?") + " / " + (p.venue_b || "?") + " " +
      (p.odds_b || "?") + ", stakes " + (p.stake_a || "?") + " + " + (p.stake_b || "?") +
      ", expected profit " + (p.expected_profit || "?");
  };
  for (const btn of document.querySelectorAll("button[data-approve]")) {
    btn.addEventListener("click", () => act(btn.dataset.approve, "approve",
      "Approve trade " + btn.dataset.approve + " on " + node + "?\n\n" + rowSummary(btn.dataset.approve) +
      "\n\nThe node re-runs every live gate on fresh quotes before placing orders."));
  }
  for (const btn of document.querySelectorAll("button[data-reject]")) {
    btn.addEventListener("click", () => act(btn.dataset.reject, "reject",
      "Reject trade " + btn.dataset.reject + " on " + node + "? The staged arb is discarded."));
  }
}

const CANDIDATE_COLS = [
  ["instrument", "Instrument", "t"],
  ["venues", "Venues", "t"],
  ["marketFamily", "Market/Line", "t"],
  ["profitMargin", "Profit", "n"],
  ["rawProfitMargin", "Raw", "n"],

  ["safetyTier", "Safety", "t"],

const EVENT_COL = ["event", "Event", "t"]; // shown only when rows carry event names
const EDGE_KINDS = [
  ["topPositiveCandidates", "positive", "Positive candidates"],
  ["topNegativeNearMisses", "negative", "Negative near-misses"],
  ["topValueEdgeCandidates", "value", "Value edges"],
];
function tabEdgesShell() {

// instrument ids are "{symbol}.{VENUE}"; venue has its own column, so drop the
// suffix and keep first + last symbol fragments (Polymarket symbols are long hex)
function shortInstrumentId(id) {
  const s = String(id);
  const dot = s.lastIndexOf(".");
  const sym = dot > 0 ? s.slice(0, dot) : s;
  const frag = f => (f.length > 14 ? f.slice(0, 8) + "…" + f.slice(-4) : f);
  const parts = sym.split("-").filter(Boolean);
  if (parts.length > 1) return frag(parts[0]) + "-" + frag(parts[parts.length - 1]);
  return frag(sym);
}
function candidateEvent(cand) {
  if (cand.eventNameA) return String(cand.eventNameA);
  if (cand.homeNameA || cand.awayNameA)
    return [cand.homeNameA, cand.awayNameA].filter(Boolean).join(" v ");
  return null;
}
function candidateMarketLine(cand) {
  const n = cand.normalizedA || cand.normalizedB;
  if (n && n.marketType) {
    let s = String(n.marketType);
    if (n.line != null && n.line !== "") s += " " + n.line;
    if (n.selectionRole) s += " (" + n.selectionRole + ")";
    return s;
  }
  return cand.marketFamily || cand.marketA || null;
}
// display/sort value for derived columns; raw payload key otherwise
function candidateValue(cand, key) {
  if (key === "instrument") return cand.instrumentIdA || cand.instrumentIdB || null;
  if (key === "venues") {
    if (cand.venuePair) return String(cand.venuePair).replace("->", "→");
    if (cand.venueA || cand.venueB) return (cand.venueA || "?") + "→" + (cand.venueB || "?");
    return Array.isArray(cand.venues) ? cand.venues.join(" · ") : cand.venues;
  }
  if (key === "marketFamily") return candidateMarketLine(cand);
  if (key === "event") return candidateEvent(cand);
  return cand[key];
}
function candidateCell(cand, key, kind) {
  if (key === "instrument") {
    const ids = [cand.instrumentIdA, cand.instrumentIdB].filter(x => x != null && x !== "");
    if (!ids.length) return "—";
    return '<span title="' + esc(ids.join(" / ")) + '">' +
      ids.map(x => esc(shortInstrumentId(x))).join("<br>") + "</span>";
  }
  if (key === "rejectionBucket") {
    const rb = cand.rejectionBucket, br = cand.blockerReason;
    const both = [rb, br].filter(x => x != null && x !== "");
    const uniq = both.filter((x, i) => both.indexOf(x) === i);
    return uniq.length ? esc(uniq.join(" / ")) : "—";
  }
  const v = candidateValue(cand, key);
  if (v == null || v === "") return "—";
  if (key === "feeAdjustedOddsA" || key === "feeAdjustedOddsB") return fmtNum(v, 3);
  return esc(String(v));
}
function sortCandidates(list, kind) {
  const sort = state.sort[kind];
  if (!sort) return list.slice();
  const [key, dir] = sort;
  const col = CANDIDATE_COLS.find(c => c[0] === key);
  const numeric = col && col[2] === "n";
  const arr = list.slice();
  arr.sort((a, b) => {
    let av = candidateValue(a, key), bv = candidateValue(b, key);
    if (numeric) {
      const an = toNum(av), bn = toNum(bv);
      const aa = Number.isNaN(an) ? Infinity : an; // NaN sorts last
      const bb = Number.isNaN(bn) ? Infinity : bn;
      return dir === "asc" ? aa - bb : bb - aa;
    }
    av = av == null ? "" : String(av);
    bv = bv == null ? "" : String(bv);
    return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  return arr;
}
function candidateTable(list, kind) {
  if (!list || !list.length) return '<div class="muted">no candidates</div>';
  const cols = list.some(c => candidateEvent(c) != null)
    ? [EVENT_COL].concat(CANDIDATE_COLS) : CANDIDATE_COLS;
  const sort = state.sort[kind];
  const head = cols.map(([key, label, t]) => {
    let arrow = "";
    if (sort && sort[0] === key) arrow = ' <span class="arrow">' + (sort[1] === "asc" ? "▲" : "▼") + "</span>";
    const cls = "sortable" + (t === "n" ? " num" : "");
    return '<th class="' + cls + '" data-kind="' + kind + '" data-key="' + esc(key) + '">' +
      esc(label) + arrow + "</th>";
  }).join("");
  const rows = sortCandidates(list, kind).map(c => {
    return "<tr>" + cols.map(([key, , t]) =>
      '<td' + (t === "n" ? ' class="num"' : "") + ">" + candidateCell(c, key, kind) + "</td>").join("") + "</tr>";
  }).join("");
  return '<div class="table-scroll"><table class="data"><thead><tr>' + head +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>";
}
function renderEdges() {
  const el = document.getElementById("edgesBody");
  if (!el) return;
  const probe = (state.detail && state.detail.runtimeProbe) || {};
  const cq = probe.candidateQuality || {};
  const stored = (state.edges && state.edges.kinds) || {};
  const out = [];
  for (const [key, kind, label] of EDGE_KINDS) {
    const live = Array.isArray(cq[key]) ? cq[key] : null;
    const storedEntry = stored[key];
    const storedList = storedEntry && Array.isArray(storedEntry.candidates) ? storedEntry.candidates : null;
    out.push('<div class="section"><h3>' + esc(label) + "</h3>");
    // Prefer live; show stored beneath with its timestamp.
    if (live && live.length) {
      out.push('<div class="subtle">live · from current probe</div>');
      out.push(candidateTable(live, kind));
    } else if (storedList && storedList.length) {
      out.push('<div class="subtle">stored · captured ' + esc(storedEntry.ts_utc || "?") + "</div>");
      out.push(candidateTable(storedList, kind));
    } else {
      out.push('<div class="muted">no candidates</div>');
    }
    out.push("</div>");
  }
  if (state.edges && state.edges._error) {
    out.push('<div class="subtle neg">stored odds unavailable: ' + esc(state.edges._error) + "</div>");
  }
  el.innerHTML = out.join("");
  for (const th of el.querySelectorAll("th.sortable")) {
    th.addEventListener("click", () => {
      const kind = th.dataset.kind, key = th.dataset.key;
      const cur = state.sort[kind];
      let dir = "asc";
      if (cur && cur[0] === key) dir = cur[1] === "asc" ? "desc" : "asc";
      state.sort[kind] = [key, dir];
      renderEdges();
    });
  }
}

function matrixTable(m) {

  return '<div class="tabpane active">' +
    '<div class="section"><h3>Margin bands</h3>' + renderBarList(cq.marginBands) + "</div>" +
    '<div class="section"><h3>Rejection buckets</h3>' + renderBarList(cq.rejectionBuckets) + "</div>" +
    '<div class="section"><h3>Timing flags</h3>' + renderBarList(cq.timingFlags) + "</div>" +
    "</div>";
}

// ---- Tab 8: Latency / SLO --------------------------------------------------
function looksBreached(k, v) {
  const s = String(v).toLowerCase();
  return s.includes("breach") || s.includes("violat") || s === "fail" || s === "false" ||
    s.includes("exceeded");
}
function renderKVFlagged(obj) {
  if (obj == null || typeof obj !== "object" || !Object.keys(obj).length)
    return '<div class="muted">no data</div>';
  const rows = Object.entries(obj).map(([k, v]) => {
    if (v != null && typeof v === "object") {
      return '<span class="k">' + esc(k) + '</span><span class="v"><pre class="manifest">' +
        esc(JSON.stringify(v, null, 2)) + "</pre></span>";
    }
    const cls = looksBreached(k, v) ? ' class="v neg"' : ' class="v"';
    return '<span class="k">' + esc(k) + "</span><span" + cls + ">" + esc(v == null ? "—" : String(v)) + "</span>";
  }).join("");
  return '<div class="kv">' + rows + "</div>";
}
function tabLatency(probe) {
  return '<div class="tabpane active">' +
    '<div class="section"><h3>Latency diagnostics</h3>' + renderKVFlagged(probe.latencyDiagnostics) + "</div>" +
    '<div class="section"><h3>SLO status</h3>' + renderKVFlagged(probe.sloStatus) + "</div>" +
    "</div>";
}

// ---- Tab 9: Diagnostics ----------------------------------------------------
// Devig panel surfaces existing probe data (candidateQuality.devigDiagnostics —
// overround / vig / value-edge percentiles / method counts) plus the count and
// recency of stored odds_samples. Read-only visibility into devig behaviour; this
// is NOT the odds→settlement money-path validation (data-gated, separate work).
function devigPanel(d, probe) {
  const cq = probe.candidateQuality || {};
  const devig = (d && d.devigDiagnostics != null) ? d.devigDiagnostics : cq.devigDiagnostics;
  const odds = (d && d.oddsSamples) || {};
  const out = [];
  const count = odds.count == null ? 0 : odds.count;
  out.push('<div class="subtle">stored odds samples: <b>' + esc(String(count)) + "</b>" +
    (odds.latestTs ? " · latest " + esc(odds.latestTs) : " · none captured yet") + "</div>");
  if (devig == null || (typeof devig === "object" && !Object.keys(devig).length)) {
    out.push('<div class="muted">no devigDiagnostics in the current probe</div>');
  } else if (typeof devig === "object" && !Array.isArray(devig)) {
    out.push(renderKV(devig));
  } else {
    out.push(renderJSON(devig));
  }
  return out.join("");
}
function tabDiag(probe, d) {
  return '<div class="tabpane active">' +
    '<div class="section"><h3>Devig diagnostics</h3>' + devigPanel(d, probe) + "</div>" +
    '<div class="section"><h3>Coverage diagnostics</h3>' + renderJSON(probe.coverageDiagnostics) + "</div>" +
    '<div class="section"><h3>Semantic diagnostics</h3>' + renderJSON(probe.semanticDiagnostics) + "</div>" +
    "</div>";
}

// ---- Tab 10: Policy (read-only display, no controls) -----------------------
function tabPolicy(probe) {
  return '<div class="tabpane active">' +
    '<div class="subtle">Read-only. Execution-arming is not exposed.</div>' +
    '<div class="section"><h3>Fee policy</h3>' + renderKV(probe.feePolicy) + "</div>" +
    '<div class="section"><h3>Execution readiness</h3>' + renderKV(probe.executionReadiness) + "</div>" +
    "</div>";
}

// ---- Tab 11: Manifest ------------------------------------------------------
function tabManifest(d) {
  return '<div class="tabpane active"><div class="section"><h3>manifest.runtime.json</h3>' +
    '<pre class="manifest">' +
    esc(d.manifest ? JSON.stringify(d.manifest, null, 2) : "no manifest.runtime.json") +
    "</pre></div></div>";
}

// ---- Tab 12: Controls (deploy REMOVED; lifecycle + typed-name delete) ------
function tabControls(d) {
  const ro = d.readonly;
  const disabled = ro ? "disabled" : "";
  const out = ['<div class="tabpane active">'];
  out.push('<div class="section"><h3>Lifecycle' +
    (ro ? ' <span class="muted">(read-only)</span>' : "") + "</h3>");
  out.push('<div class="actions">');
  out.push('<button data-act="restart" ' + disabled + ">Restart</button>");
  out.push('<button data-act="stop" ' + disabled + ">Stop</button>");
  out.push('<button data-act="start" ' + disabled + ">Start</button>");
  out.push('<button class="danger" data-act="delete" ' + disabled + ">Delete…</button>");
  out.push("</div>");
  // typed-name delete confirmation (hidden until Delete… clicked)
  out.push('<div class="del-confirm" id="delConfirm">' +
    '<label>Type the node name to confirm deletion: <b>' + esc(state.current) + "</b></label>" +
    '<input id="delInput" type="text" autocomplete="off" placeholder="' + esc(state.current) + '">' +
    '<div class="actions">' +
    '<button class="link-btn" id="delCancel" type="button">Cancel</button>' +
    '<button class="danger" id="delGo" type="button" disabled>Delete node</button>' +
    "</div></div>");
  out.push('<div id="job"></div>');
  out.push("</div></div>");
  return out.join("");
}

function wireControls(node, ro) {
  const jobEl = document.getElementById("job");
  const delConfirm = document.getElementById("delConfirm");
  const delInput = document.getElementById("delInput");
  const delGo = document.getElementById("delGo");
  const delCancel = document.getElementById("delCancel");

  for (const btn of document.querySelectorAll(".actions button[data-act]")) {
    btn.addEventListener("click", async () => {
      if (ro) return;
      const act = btn.dataset.act;
      if (act === "delete") {
        delConfirm.classList.add("open");
        delInput.value = "";
        delGo.disabled = true;
        delInput.focus();
        return;
      }
      if (!confirm(act.charAt(0).toUpperCase() + act.slice(1) + " node " + node + "?")) return;
      jobEl.textContent = act + "…";
      try {
        await api("/api/nodes/" + encodeURIComponent(node) + "/" + act, { method: "POST" });
        jobEl.textContent = act + ": ok";
        setTimeout(loadNodes, 1000);
      } catch (e) {
        jobEl.textContent = act + " failed: " + e.message;
      }
    });
  }

  if (delInput) {
    delInput.addEventListener("input", () => { delGo.disabled = delInput.value !== node; });
  }
  if (delCancel) {
    delCancel.addEventListener("click", () => { delConfirm.classList.remove("open"); });
  }
  if (delGo) {
    delGo.addEventListener("click", async () => {
      if (ro || delInput.value !== node) return;
      delConfirm.classList.remove("open");
      jobEl.textContent = "delete…";
      try {
        const r = await api("/api/nodes/" + encodeURIComponent(node), { method: "DELETE" });
        pollJob(r.job_id, jobEl);
      } catch (e) {
        jobEl.textContent = "delete failed: " + e.message;
      }
    });
  }
}

async function pollJob(jobId, el) {
  for (let i = 0; i < 240; i++) {
    let job;
    try { job = await api("/api/jobs/" + jobId); } catch (e) { el.textContent = "job error: " + e.message; return; }
    el.textContent = "job " + job.kind + " [" + job.state + "]" +
      (job.returncode != null ? " rc=" + job.returncode : "") +
      (job.stdout ? "\n" + job.stdout : "") + (job.stderr ? "\n" + job.stderr : "");
    if (job.state !== "running") { setTimeout(loadNodes, 1000); return; }
    await new Promise(r => setTimeout(r, 2000));
  }
}

// ---- auth / change-password (spec D.6) -------------------------------------
async function loadWhoami() {
  let who;
  try {
    who = await api("/api/auth/whoami");
  } catch (e) {
    return; // if whoami fails (e.g. 401) the browser Basic prompt handles auth
  }
  state.authUsername = who.username;
  state.authIsDefault = who.is_default === true;
  state.authDisabled = who.username == null;
  const wa = document.getElementById("whoami");
  wa.textContent = who.username ? "signed in as " + who.username : "auth disabled";
  // hide change-password affordance when auth is disabled (no store to change)
  document.getElementById("changePwBtn").classList.toggle("hidden", state.authDisabled);
  if (state.authIsDefault) openPwModal(true);
}

function openPwModal(mandatory) {
  const scrim = document.getElementById("modalScrim");
  const title = document.getElementById("modalTitle");
  const hint = document.getElementById("modalHint");
  const msg = document.getElementById("pwMsg");
  const cancel = document.getElementById("pwCancel");
  document.getElementById("pwForm").reset();
  msg.textContent = "";
  msg.className = "msg";
  scrim.dataset.mandatory = mandatory ? "1" : "0";
  title.textContent = mandatory ? "Change the default password" : "Change password";
  hint.textContent = mandatory
    ? "This node is still on the shipped default (admin/admin). Set a new password to continue."
    : "Rotate the credential used for this dashboard.";
  cancel.classList.toggle("hidden", !!mandatory);
  scrim.classList.add("open");
  document.getElementById("pwCurrent").focus();
}
function closePwModal() {
  if (document.getElementById("modalScrim").dataset.mandatory === "1" && state.authIsDefault) return;
  document.getElementById("modalScrim").classList.remove("open");
}

function wirePwModal() {
  document.getElementById("changePwBtn").addEventListener("click", () => {
    if (state.authDisabled) return;
    openPwModal(false);
  });
  document.getElementById("pwCancel").addEventListener("click", closePwModal);
  document.getElementById("pwForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const msg = document.getElementById("pwMsg");
    const current = document.getElementById("pwCurrent").value;
    const user = document.getElementById("pwUser").value.trim();
    const np = document.getElementById("pwNew").value;
    const confirmPw = document.getElementById("pwConfirm").value;
    msg.className = "msg err";
    if (np.length < 8) { msg.textContent = "new password too short (min 8)"; return; }
    if (np !== confirmPw) { msg.textContent = "passwords do not match"; return; }
    const body = { current_password: current, new_password: np };
    if (user) body.new_username = user;
    try {
      const r = await api("/api/auth/change", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      state.authIsDefault = false;
      msg.className = "msg ok";
      msg.textContent = "Password changed" +
        (user ? ". You may be prompted to re-authenticate on next reload." : ".");
      // reflect new identity + re-load
      await loadWhoami();
      setTimeout(() => {
        document.getElementById("modalScrim").classList.remove("open");
        loadNodes();
      }, user ? 1400 : 700);
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = e.message;
    }
  });
}

// ---- ops panel: Alerts + Audit ---------------------------------------------
function openOps(which) {
  state.ops = which;
  const scrim = document.getElementById("opsScrim");
  const panel = document.getElementById("opsPanel");
  scrim.classList.add("open");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  panel.innerHTML = '<button class="close" id="opsClose">&times;</button>' +
    "<h2>" + (which === "alerts" ? "Alerts" : "Audit log") + '</h2>' +
    '<div class="sub" id="opsSub">loading…</div><div id="opsBody"></div>';
  document.getElementById("opsClose").addEventListener("click", closeOps);
  if (which === "alerts") loadAlerts();
  else loadAudit();
}
function closeOps() {
  state.ops = null;
  document.getElementById("opsScrim").classList.remove("open");
  const panel = document.getElementById("opsPanel");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
}

async function loadAlerts() {
  const body = document.getElementById("opsBody");
  const sub = document.getElementById("opsSub");
  let data;
  try {
    data = await api("/api/alerts");
  } catch (e) {
    sub.textContent = "error: " + e.message;
    return;
  }
  const hook = data.webhook_configured
    ? '<code>' + esc(data.webhook || "configured") + "</code>"
    : '<span class="warn">no webhook configured (set NODEOPS_ALERT_WEBHOOK)</span>';
  const testBtn = state.readonly
    ? '<span class="muted">(read-only — test disabled)</span>'
    : '<button class="link-btn" id="alertTest" type="button">Test webhook</button>';
  sub.innerHTML = "";
  const out = ['<div class="hookbar">webhook: ' + hook + " " + testBtn + "</div>"];
  out.push('<div id="alertTestResult" class="subtle"></div>');
  const alerts = Array.isArray(data.alerts) ? data.alerts : [];
  if (!alerts.length) {
    out.push('<div class="muted">no alerts recorded yet</div>');
  } else {
    out.push(alerts.map(a =>
      '<div class="alert-row">' +
      '<span class="sev ' + esc(a.severity || "info") + '">' + esc(a.severity || "info") + "</span>" +
      '<span class="ats">' + esc(a.ts_utc || "") + "</span>" +
      '<span class="anode">' + esc(a.node || "") + "</span>" +
      '<span class="adet">' + esc(a.condition || "") +
      (a.detail ? " — " + esc(a.detail) : "") + "</span></div>").join(""));
  }
  body.innerHTML = out.join("");
  const tb = document.getElementById("alertTest");
  if (tb) {
    tb.addEventListener("click", async () => {
      const r = document.getElementById("alertTestResult");
      r.textContent = "firing test alert…";
      try {
        const res = await api("/api/alerts/test", { method: "POST" });
        r.textContent = res.webhook_configured
          ? "test alert POSTed to " + (res.webhook || "webhook")
          : "test alert recorded (no webhook configured to POST)";
        loadAlerts();
      } catch (e) {
        r.textContent = "test failed: " + e.message;
      }
    });
  }
}

async function loadAudit() {
  const body = document.getElementById("opsBody");
  const sub = document.getElementById("opsSub");
  let data;
  try {
    data = await api("/api/audit?limit=200");
  } catch (e) {
    sub.textContent = "error: " + e.message;
    return;
  }
  const rows = Array.isArray(data.rows) ? data.rows : [];
  sub.textContent = rows.length + " recent entries";
  if (!rows.length) {
    body.innerHTML = '<div class="muted">no mutating actions recorded yet</div>';
    return;
  }
  const head = "<tr><th>When</th><th>Who</th><th>Action</th><th>Node</th>" +
    "<th>Params</th><th>Outcome</th></tr>";
  const trs = rows.map(r =>
    "<tr><td>" + esc(r.ts_utc || "—") + "</td><td>" + esc(r.username || "—") + "</td>" +
    "<td>" + esc(r.action || "—") + "</td><td>" + esc(r.node || "—") + "</td>" +
    '<td title="' + esc(r.params_summary || "") + '">' + esc(r.params_summary || "—") + "</td>" +
    "<td>" + esc(r.status || "—") + "</td></tr>").join("");
  body.innerHTML = '<div class="table-scroll"><table class="data"><thead>' + head +
    "</thead><tbody>" + trs + "</tbody></table></div>";
}

// ---- boot ------------------------------------------------------------------
document.getElementById("scrim").addEventListener("click", closeDrawer);
document.getElementById("opsScrim").addEventListener("click", closeOps);
document.getElementById("alertsBtn").addEventListener("click", () => openOps("alerts"));
document.getElementById("auditBtn").addEventListener("click", () => openOps("audit"));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const modal = document.getElementById("modalScrim");
  if (modal.classList.contains("open")) { closePwModal(); return; }
  if (state.ops) { closeOps(); return; }
  closeDrawer();
});
document.getElementById("modalScrim").addEventListener("click", e => {
  if (e.target === document.getElementById("modalScrim")) closePwModal();
});

wireFilters();
wirePwModal();
loadWhoami();
loadNodes();
state.timer = setInterval(() => {
  loadNodes();
  if (state.current && state.tab === "history") loadCharts(state.current);
}, REFRESH_MS);
</script>
